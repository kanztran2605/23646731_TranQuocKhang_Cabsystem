openapi: 3.0.3
info:
  title: CAB System API
  version: 2.0.0
  description: REST API cho hệ thống đặt xe CAB, bám theo SRS baseline và Rubric 30 tiêu chí.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway - môi trường local/demo
tags:
- name: Trips
  description: Trip lifecycle, cancellation và review
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu Access Token hoặc Access Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Người dùng đã xác thực nhưng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Vượt quá giới hạn request; Gateway trả HTTP 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Trip:
      type: object
      required:
      - tripId
      - bookingId
      - customerId
      - driverId
      - status
      properties:
        tripId:
          type: string
          example: TRIP001
        bookingId:
          type: string
          example: BKG001
        customerId:
          type: string
          example: CUS001
        driverId:
          type: string
          example: DRV001
        status:
          type: string
          enum:
          - ASSIGNED
          - ARRIVED
          - PICKED_UP
          - IN_PROGRESS
          - COMPLETED
          - CANCELED
          - ABNORMAL
        distanceKm:
          type: number
          format: double
        cancelReason:
          type: string
          nullable: true
        canceledAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    TripStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ARRIVED
          - PICKED_UP
          - IN_PROGRESS
          - COMPLETED
    CancelTripRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          example: Customer changed plan
    ReviewRequest:
      type: object
      required:
      - score
      properties:
        comment:
          type: string
          maxLength: 1000
          example: Driver phục vụ tốt
          description: Phải được validate/sanitize theo NFR33
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
    Review:
      type: object
      properties:
        reviewId:
          type: string
        tripId:
          type: string
        customerId:
          type: string
        driverId:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        score:
          type: integer
          minimum: 1
          maximum: 5
      required:
      - reviewId
      - tripId
      - customerId
      - driverId
      - score
    Error:
      type: object
      required:
      - code
      - message
      - timestamp
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
paths:
  /trips/{tripId}:
    get:
      tags:
      - Trips
      summary: Xem thông tin Trip
      operationId: getTrip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Thông tin Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/status:
    patch:
      tags:
      - Trips
      summary: Driver cập nhật trạng thái Trip theo State Machine
      operationId: updateTripStatus
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR04.01-FR04.04
      - FR04.12
      - UC09
      - AC09.01-AC09.08
      description: 'Trình tự hợp lệ: ASSIGNED -> ARRIVED -> PICKED_UP -> IN_PROGRESS -> COMPLETED. Chuyển trạng thái không
        hợp lệ trả 409.'
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
      responses:
        '200':
          description: Trạng thái Trip đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{tripId}/cancel:
    post:
      tags:
      - Trips
      summary: Customer hủy Trip
      operationId: cancelTrip
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR04.08-FR04.11
      - UC25
      - AC25.01-AC25.07
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTripRequest'
      responses:
        '200':
          description: Trip chuyển sang CANCELED và phát trip.canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{tripId}/reviews:
    post:
      tags:
      - Trips
      summary: Customer đánh giá Driver sau khi Trip hoàn thành
      operationId: createTripReview
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR08.04
      - FR08.05
      - UC15
      - AC15.01-AC15.06
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Review được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
