openapi: 3.0.3
info:
  title: CAB System API
  version: 2.0.0
  description: REST API cho hệ thống đặt xe CAB, bám theo SRS baseline và Rubric 30 tiêu chí.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway - môi trường local/demo
tags:
- name: Bookings
  description: Booking, driver offer và lịch sử Booking
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu Access Token hoặc Access Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Người dùng đã xác thực nhưng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Vượt quá giới hạn request; Gateway trả HTTP 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống tạo Booking trùng khi retry
      schema:
        type: string
        minLength: 8
        maxLength: 255
      example: BOOK-CUS001-001
  schemas:
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 10.8231
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 106.6297
        address:
          type: string
          example: Ho Chi Minh City
    CreateBookingRequest:
      type: object
      required:
      - pickup
      - destination
      - vehicleTypeId
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleTypeId:
          type: string
          example: CAR_4_SEATS
    AssignedDriver:
      type: object
      properties:
        driverId:
          type: string
        fullName:
          type: string
        rating:
          type: number
          format: double
        vehicle:
          type: object
          properties:
            vehicleTypeId:
              type: string
            brand:
              type: string
            model:
              type: string
            licensePlate:
              type: string
    Booking:
      type: object
      required:
      - bookingId
      - customerId
      - status
      - pickup
      - destination
      - vehicleTypeId
      properties:
        bookingId:
          type: string
          example: BKG001
        customerId:
          type: string
          example: CUS001
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleTypeId:
          type: string
        status:
          type: string
          enum:
          - SEARCHING_DRIVER
          - DRIVER_ASSIGNED
          - EXPIRED
          - CANCELED
          - COMPLETED
        assignedDriver:
          allOf:
          - $ref: '#/components/schemas/AssignedDriver'
          nullable: true
        createdAt:
          type: string
          format: date-time
    DriverOffer:
      type: object
      required:
      - bookingId
      - expiresAt
      - pickup
      - destination
      properties:
        bookingId:
          type: string
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleTypeId:
          type: string
        expiresAt:
          type: string
          format: date-time
    AcceptBookingResponse:
      type: object
      required:
      - bookingId
      - tripId
      - status
      properties:
        bookingId:
          type: string
        tripId:
          type: string
        status:
          type: string
          enum:
          - DRIVER_ASSIGNED
    PageBooking:
      type: object
      required:
      - page
      - limit
      - total
      - items
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          example: 5
        total:
          type: integer
          example: 5
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
    Error:
      type: object
      required:
      - code
      - message
      - timestamp
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
paths:
  /bookings:
    post:
      tags:
      - Bookings
      summary: Customer tạo Booking và tự động khởi động quá trình tìm Driver
      operationId: createBooking
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR02.01-FR02.06
      - FR03.01-FR03.06
      - UC06
      - UC07
      - AC06.*
      description: Sau khi Booking được tạo với trạng thái SEARCHING_DRIVER, Booking Service phát sự kiện booking.created
        qua RabbitMQ để bắt đầu matching. Client không phải gọi endpoint matching riêng.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking được tạo và chuyển sang SEARCHING_DRIVER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /bookings/{bookingId}:
    get:
      tags:
      - Bookings
      summary: Xem Booking
      operationId: getBooking
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Thông tin Booking; khi đã có Driver sẽ chứa assignedDriver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/me/bookings:
    get:
      tags:
      - Bookings
      summary: Lịch sử Booking của Customer hiện tại
      operationId: getMyBookings
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR08.01
      - FR08.06
      - UC14
      - AC14.01-AC14.05
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
      responses:
        '200':
          description: Danh sách Booking của Customer theo phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBooking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /drivers/me/offers:
    get:
      tags:
      - Bookings
      summary: Driver xem các offer đang chờ phản hồi
      operationId: getMyDriverOffers
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách offer chưa hết hạn
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverOffer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /bookings/{bookingId}/accept:
    post:
      tags:
      - Bookings
      summary: Driver chấp nhận offer/Booking
      operationId: acceptBooking
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR03.07
      - FR03.11
      - FR03.14
      - UC08
      - AC08.*
      parameters:
      - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Driver được phân công và Trip được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptBookingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bookings/{bookingId}/reject:
    post:
      tags:
      - Bookings
      summary: Driver từ chối offer/Booking
      operationId: rejectBooking
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR03.08
      - FR03.09
      - UC08
      - AC08.04-AC08.06
      parameters:
      - $ref: '#/components/parameters/BookingId'
      responses:
        '204':
          description: Từ chối thành công; hệ thống tiếp tục tìm Driver khác nếu còn điều kiện
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
