openapi: 3.0.3
info:
  title: CAB System API
  version: 2.0.0
  description: 'REST API cho hệ thống đặt xe CAB.

    Thiết kế API được xây dựng dựa trên yêu cầu chức năng SRS, Use Case,

    tiêu chí chấp nhận, tác nhân và quy tắc nghiệp vụ.

    '
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway - môi trường local/demo
tags:
- name: Xe
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Người dùng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu Access Token hoặc Access Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Vượt quá giới hạn request; Gateway trả HTTP 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
        driverId:
          type: string
        vehicleTypeId:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          example: ACTIVE
        licensePlate:
          type: string
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Vios
    VehicleRequest:
      type: object
      required:
      - driverId
      - vehicleTypeId
      - licensePlate
      properties:
        driverId:
          type: string
        vehicleTypeId:
          type: string
        licensePlate:
          type: string
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Vios
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
paths:
  /vehicles:
    get:
      tags:
      - Xe
      summary: Xem danh sách xe
      operationId: listXe
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách xe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Xe
      summary: Tạo xe
      operationId: createVehicle
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Tạo xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /vehicles/{vehicleId}:
    put:
      tags:
      - Xe
      summary: Cập nhật xe
      operationId: updateVehicle
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Cập nhật xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
