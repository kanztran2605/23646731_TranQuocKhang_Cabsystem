openapi: 3.0.0
info:
  title: API Hệ thống đặt xe CAB
  version: 1.0.0
  description: 'REST API cho hệ thống đặt xe CAB.

    Thiết kế API được xây dựng dựa trên yêu cầu chức năng SRS, Use Case,

    tiêu chí chấp nhận, tác nhân và quy tắc nghiệp vụ.

    '
servers:
- url: http://localhost:8080/api/v1
  description: Máy chủ phát triển cục bộ
tags:
- name: Tài xế
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Yêu cầu xác thực hoặc thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Người dùng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Driver:
      type: object
      properties:
        driverId:
          type: string
        userId:
          type: string
        fullName:
          type: string
        phone:
          type: string
        status:
          type: string
          enum:
          - AVAILABLE
          - BUSY
          - OFFLINE
        vehicleTypeId:
          type: string
    UpdateDriverRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        vehicleTypeId:
          type: string
    DriverStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - AVAILABLE
          - BUSY
          - OFFLINE
    LocationRequest:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.7769
        longitude:
          type: number
          format: double
          example: 106.7009
    Location:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
paths:
  /drivers:
    get:
      tags:
      - Tài xế
      summary: Xem danh sách tài xế
      operationId: listTài xế
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - AVAILABLE
          - BUSY
          - OFFLINE
      - name: vehicleTypeId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Danh sách tài xế
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /drivers/{driverId}:
    put:
      tags:
      - Tài xế
      summary: Cập nhật thông tin tài xế
      operationId: updateDriver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverRequest'
      responses:
        '200':
          description: Cập nhật tài xế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /drivers/{driverId}/status:
    patch:
      tags:
      - Tài xế
      summary: Cập nhật trạng thái tài xế
      operationId: updateDriverStatus
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái tài xế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /drivers/me/location:
    put:
      tags:
      - Tài xế
      summary: Cập nhật vị trí hiện tại của tài xế
      operationId: updateDriverLocation
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Ghi nhận vị trí thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
