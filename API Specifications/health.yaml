openapi: 3.0.3
info:
  title: CAB System Gateway Health API
  version: 2.0.0
  description: Các endpoint kỹ thuật của API Gateway phục vụ liveness, readiness và tổng hợp trạng thái service (NFR36, AC-G11).
servers:
- url: http://localhost:8080
  description: API Gateway - môi trường local/demo
tags:
- name: Health
  description: Liveness, readiness và service health
components:
  schemas:
    SimpleHealth:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - healthy
          - ready
          - not-ready
          example: healthy
    ServiceHealth:
      type: object
      required:
      - name
      - status
      properties:
        name:
          type: string
          example: auth-service
        status:
          type: string
          enum:
          - healthy
          - unhealthy
          example: healthy
        detail:
          type: string
          nullable: true
    ServiceHealthResponse:
      type: object
      required:
      - status
      - services
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
          example: healthy
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceHealth'
paths:
  /health:
    get:
      tags:
      - Health
      summary: Gateway liveness
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Gateway đang hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleHealth'
  /ready:
    get:
      tags:
      - Health
      summary: Gateway readiness
      operationId: getReady
      security: []
      responses:
        '200':
          description: Gateway sẵn sàng phục vụ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleHealth'
        '503':
          description: Gateway hoặc dependency quan trọng chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleHealth'
  /health/services:
    get:
      tags:
      - Health
      summary: Trạng thái các service quan trọng
      operationId: getServiceHealth
      security: []
      responses:
        '200':
          description: Trạng thái các service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealthResponse'
