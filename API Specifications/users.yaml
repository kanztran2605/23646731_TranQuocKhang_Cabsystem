openapi: 3.0.0

info:
  title: API Hệ thống đặt xe CAB
  version: 1.0.0
  description: >
    REST API cho hệ thống đặt xe CAB.

    Thiết kế API được xây dựng dựa trên yêu cầu chức năng SRS,
    Use Case, tiêu chí chấp nhận, tác nhân và quy tắc nghiệp vụ.

servers:
  - url: http://localhost:8080/api/v1
    description: Máy chủ phát triển cục bộ

tags:
  - name: Người dùng
    description: Quản lý hồ sơ người dùng và tra cứu thông tin khách hàng

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:

    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Yêu cầu xác thực hoặc thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Người dùng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Không tìm thấy người dùng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    UserResponse:
      type: object
      required:
        - userId
        - username
        - fullName
        - role
      properties:
        userId:
          type: string
          example: U001

        username:
          type: string
          example: nguyen123

        fullName:
          type: string
          example: Nguyen Van A

        phone:
          type: string
          example: '0901234567'

        email:
          type: string
          format: email
          example: nguyenvana@example.com

        role:
          type: string
          enum:
            - CUSTOMER
            - DRIVER
            - OPERATION_STAFF
            - MANAGEMENT
            - ADMIN
          example: CUSTOMER

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Nguyen Van A

        phone:
          type: string
          example: '0901234567'

        email:
          type: string
          format: email
          example: nguyenvana@example.com

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST

        message:
          type: string
          example: Request data is invalid

        timestamp:
          type: string
          format: date-time

paths:

  # =========================================================
  # XEM HỒ SƠ NGƯỜI DÙNG HIỆN TẠI
  # FR01.05
  # =========================================================

  /users/me:

    get:
      tags:
        - Người dùng

      summary: Xem hồ sơ người dùng hiện tại

      description: >
        Cho phép người dùng đã xác thực xem thông tin hồ sơ cá nhân
        của chính mình.

      operationId: getMyProfile

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Hồ sơ người dùng hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - Người dùng

      summary: Cập nhật hồ sơ người dùng hiện tại

      description: >
        Cho phép người dùng đã xác thực cập nhật thông tin cá nhân
        của chính mình.

      operationId: updateMyProfile

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'

      responses:

        '200':
          description: Cập nhật hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'


  # =========================================================
  # TRA CỨU KHÁCH HÀNG
  # FR09.01
  # =========================================================

  /users/customers:

    get:
      tags:
        - Người dùng

      summary: Tra cứu danh sách khách hàng

      description: >
        Cho phép Operation Staff tra cứu danh sách Customer
        trong hệ thống.

      operationId: getCustomers

      security:
        - bearerAuth: []

      parameters:

        - name: keyword
          in: query
          description: Từ khóa tìm kiếm theo tên, số điện thoại hoặc email
          required: false
          schema:
            type: string
          example: Nguyen Van A

        - name: page
          in: query
          description: Số trang
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: pageSize
          in: query
          description: Số lượng khách hàng trên mỗi trang
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:

        '200':
          description: Danh sách khách hàng
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'


  # =========================================================
  # XEM THÔNG TIN KHÁCH HÀNG
  # FR09.01
  # =========================================================

  /users/customers/{userId}:

    get:
      tags:
        - Người dùng

      summary: Xem thông tin khách hàng

      description: >
        Cho phép Operation Staff xem thông tin chi tiết
        của một Customer.

      operationId: getCustomerById

      security:
        - bearerAuth: []

      parameters:

        - name: userId
          in: path
          required: true
          description: Mã người dùng
          schema:
            type: string
          example: U001

      responses:

        '200':
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'