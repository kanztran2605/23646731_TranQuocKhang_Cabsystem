openapi: 3.0.3

info:
  title: CAB System API - Users
  version: 2.1.0
  description: >
    REST API cho các chức năng quản lý hồ sơ người dùng
    và tra cứu thông tin Customer trong CAB System.

    Thiết kế API được xây dựng dựa trên SRS, Use Case,
    Acceptance Criteria, DDD và các quy tắc phân quyền
    của hệ thống CAB.

servers:
  - url: http://localhost:8080/api/v1
    description: API Gateway - môi trường local/demo

tags:
  - name: Người dùng
    description: Quản lý hồ sơ người dùng và tra cứu thông tin Customer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Thiếu Access Token hoặc Access Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Người dùng đã xác thực nhưng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Không tìm thấy tài nguyên người dùng hoặc Customer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: Vượt quá giới hạn request; API Gateway trả HTTP 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    UserResponse:
      type: object
      description: >
        Thông tin Identity cơ bản của User.
        Phone và Email thuộc Identity & Access Context.
      required:
        - userId
        - role
        - status
      properties:
        userId:
          type: string
          description: Mã định danh User
          example: U001
        phone:
          type: string
          description: Số điện thoại thuộc Identity & Access Context
          example: '0901234567'
        email:
          type: string
          format: email
          description: Email thuộc Identity & Access Context
          example: nguyenvana@example.com
        role:
          type: string
          description: Vai trò chính của User trong phạm vi MVP
          enum:
            - CUSTOMER
            - DRIVER
            - OPERATION_STAFF
            - MANAGEMENT
            - ADMIN
          example: CUSTOMER
        status:
          type: string
          example: ACTIVE

    MyProfileResponse:
      type: object
      description: >
        Response tổng hợp hồ sơ của User hiện tại.
        Identity data như phone/email thuộc auth-service,
        trong khi profile data như fullName/address/dateOfBirth
        thuộc customer-service đối với Customer.
      required:
        - userId
        - fullName
        - role
        - status
      properties:
        userId:
          type: string
          example: U001
        customerId:
          type: string
          nullable: true
          description: Mã Customer nếu User hiện tại có Role CUSTOMER
          example: C001
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          description: Dữ liệu Identity do auth-service sở hữu
          example: '0901234567'
        email:
          type: string
          format: email
          description: Dữ liệu Identity do auth-service sở hữu
          example: nguyenvana@example.com
        address:
          type: string
          nullable: true
          example: 12 Nguyen Van Bao, Go Vap, HCMC
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: '2004-05-20'
        role:
          type: string
          enum:
            - CUSTOMER
            - DRIVER
            - OPERATION_STAFF
            - MANAGEMENT
            - ADMIN
          example: CUSTOMER
        status:
          type: string
          example: ACTIVE

    CustomerResponse:
      type: object
      description: >
        Thông tin chi tiết Customer. customerId và thông tin profile
        thuộc customer-service. userId, phone và email là thông tin
        Identity liên kết với Customer và thuộc auth-service.
      required:
        - customerId
        - userId
        - fullName
        - status
      properties:
        customerId:
          type: string
          description: Mã định danh Customer
          example: C001
        userId:
          type: string
          description: Mã User liên kết với Customer
          example: U001
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          description: Số điện thoại thuộc Identity & Access Context
          example: '0901234567'
        email:
          type: string
          format: email
          description: Email thuộc Identity & Access Context
          example: nguyenvana@example.com
        address:
          type: string
          nullable: true
          example: 12 Nguyen Van Bao, Go Vap, HCMC
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: '2004-05-20'
        status:
          type: string
          example: ACTIVE

    UpdateProfileRequest:
      type: object
      description: >
        Dữ liệu Profile mà User được phép cập nhật trong User Profile Context.
        Phone và Email không nằm trong request này vì thuộc Identity & Access Context.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          example: Nguyen Van A
        address:
          type: string
          maxLength: 255
          example: 12 Nguyen Van Bao, Go Vap, HCMC
        dateOfBirth:
          type: string
          format: date
          example: '2004-05-20'

    CustomerListResponse:
      type: object
      required:
        - page
        - pageSize
        - total
        - items
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          example: 20
        total:
          type: integer
          minimum: 0
          example: 48
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerResponse'

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time

paths:
  /users/me:
    get:
      tags:
        - Người dùng
      summary: Xem hồ sơ người dùng hiện tại
      description: >
        Cho phép User đã xác thực xem hồ sơ của chính mình.
        Response có thể tổng hợp Identity data từ auth-service
        và Profile data từ service sở hữu hồ sơ tương ứng.
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ người dùng hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-srs-trace:
        - FR01.11
        - UC03
        - AC03.01-AC03.03

    put:
      tags:
        - Người dùng
      summary: Cập nhật hồ sơ người dùng hiện tại
      description: >
        Cho phép User đã xác thực cập nhật các thông tin Profile
        thuộc phạm vi sở hữu của User Profile Context.
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Cập nhật hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-srs-trace:
        - FR01.05
        - UC03

  /users/customers:
    get:
      tags:
        - Người dùng
      summary: Tra cứu danh sách Customer
      description: >
        Cho phép Operation Staff hoặc User có quyền phù hợp
        tra cứu danh sách Customer trong CAB System.
      operationId: getCustomers
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          description: Từ khóa tìm kiếm Customer
          required: false
          schema:
            type: string
          example: Nguyen Van A
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Danh sách Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/customers/{customerId}:
    get:
      tags:
        - Người dùng
      summary: Xem thông tin Customer theo ID
      description: >
        Cho phép Operation Staff hoặc User có quyền phù hợp
        xem thông tin chi tiết của một Customer bằng customerId.
        customerId là định danh của CUSTOMER_PROFILE, không phải userId.
      operationId: getCustomerById
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          description: Mã định danh Customer
          schema:
            type: string
          example: C001
      responses:
        '200':
          description: Thông tin Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-srs-trace:
        - FR01.11
        - UC03
        - AC03.01-AC03.03
