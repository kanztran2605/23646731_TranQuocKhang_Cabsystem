openapi: 3.0.0
info:
  title: API Hệ thống đặt xe CAB
  version: 1.0.0
  description: 'REST API cho hệ thống đặt xe CAB.

    Thiết kế API được xây dựng dựa trên yêu cầu chức năng SRS, Use Case,

    tiêu chí chấp nhận, tác nhân và quy tắc nghiệp vụ.

    '
servers:
- url: http://localhost:8080/api/v1
  description: Máy chủ phát triển cục bộ
tags:
- name: Người dùng
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Yêu cầu xác thực hoặc thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    UserResponse:
      type: object
      properties:
        userId:
          type: string
          example: U001
        username:
          type: string
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - OPERATION_STAFF
          - MANAGEMENT
          - ADMIN
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
paths:
  /users/me:
    get:
      tags:
      - Người dùng
      summary: Xem hồ sơ người dùng hiện tại
      operationId: getMyProfile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ người dùng hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Người dùng
      summary: Cập nhật hồ sơ người dùng hiện tại
      operationId: updateMyProfile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Cập nhật hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
