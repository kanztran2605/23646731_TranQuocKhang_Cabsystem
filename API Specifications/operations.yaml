openapi: 3.0.3
info:
  title: CAB System API
  version: 2.0.0
  description: REST API cho hệ thống đặt xe CAB, bám theo SRS baseline và Rubric 30 tiêu chí.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway - môi trường local/demo
tags:
- name: Operations
  description: Giám sát, xử lý bất thường và duyệt Driver
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu Access Token hoặc Access Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Người dùng đã xác thực nhưng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Vượt quá giới hạn request; Gateway trả HTTP 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        type: string
  schemas:
    TripSummary:
      type: object
      properties:
        tripId:
          type: string
        bookingId:
          type: string
        customerId:
          type: string
        driverId:
          type: string
        status:
          type: string
          enum:
          - ASSIGNED
          - ARRIVED
          - PICKED_UP
          - IN_PROGRESS
          - COMPLETED
          - CANCELED
          - ABNORMAL
    ResolveTripRequest:
      type: object
      required:
      - resolution
      - note
      properties:
        resolution:
          type: string
          example: RESOLVED
        note:
          type: string
          maxLength: 1000
    DriverApprovalItem:
      type: object
      properties:
        driverId:
          type: string
        fullName:
          type: string
        phone:
          type: string
        approvalStatus:
          type: string
          enum:
          - PENDING_APPROVAL
        driverLicense:
          type: string
        submittedAt:
          type: string
          format: date-time
    PagePendingDrivers:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverApprovalItem'
    DriverApprovalRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        reason:
          type: string
          maxLength: 1000
    DriverApprovalResponse:
      type: object
      properties:
        driverId:
          type: string
        approvalStatus:
          type: string
          enum:
          - APPROVED
          - REJECTED
        updatedAt:
          type: string
          format: date-time
    PaymentSummary:
      type: object
      properties:
        paymentId:
          type: string
        tripId:
          type: string
        amount:
          type: number
          format: double
        method:
          type: string
          enum:
          - CASH
          - ONLINE
        status:
          type: string
          enum:
          - PENDING
          - COMPLETED
          - FAILED
    Error:
      type: object
      required:
      - code
      - message
      - timestamp
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
paths:
  /operations/trips/active:
    get:
      tags:
      - Operations
      summary: Giám sát Trip đang hoạt động
      operationId: getActiveTrips
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách Trip đang hoạt động
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /operations/trips/abnormal:
    get:
      tags:
      - Operations
      summary: Danh sách Trip bất thường
      operationId: getAbnormalTrips
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách Trip bất thường
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /operations/trips/{tripId}/resolve:
    post:
      tags:
      - Operations
      summary: Xử lý Trip bất thường
      operationId: resolveTrip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveTripRequest'
      responses:
        '200':
          description: Trip đã được xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /operations/transactions:
    get:
      tags:
      - Operations
      summary: Tra cứu giao dịch
      operationId: getTransactions
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - COMPLETED
          - FAILED
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Danh sách giao dịch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /operations/drivers/pending:
    get:
      tags:
      - Operations
      summary: Danh sách hồ sơ Driver chờ duyệt
      operationId: getPendingDrivers
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR09.09
      - UC23
      - AC23.01
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Danh sách Driver PENDING_APPROVAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePendingDrivers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /operations/drivers/{driverId}/approval:
    patch:
      tags:
      - Operations
      summary: Approve/Reject hồ sơ Driver
      operationId: approveOrRejectDriver
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR09.10
      - FR09.11
      - UC23
      - AC23.02-AC23.05
      parameters:
      - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverApprovalRequest'
      responses:
        '200':
          description: Kết quả duyệt Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverApprovalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
