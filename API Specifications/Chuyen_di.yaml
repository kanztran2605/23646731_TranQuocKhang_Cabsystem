openapi: 3.0.0
info:
  title: API Hệ thống đặt xe CAB
  version: 1.0.0
  description: 'REST API cho hệ thống đặt xe CAB.

    Thiết kế API được xây dựng dựa trên yêu cầu chức năng SRS, Use Case,

    tiêu chí chấp nhận, tác nhân và quy tắc nghiệp vụ.

    '
servers:
- url: http://localhost:8080/api/v1
  description: Máy chủ phát triển cục bộ
tags:
- name: Chuyến đi
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Yêu cầu xác thực hoặc thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Người dùng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Trip:
      type: object
      properties:
        tripId:
          type: string
        bookingId:
          type: string
        customerId:
          type: string
        driverId:
          type: string
        status:
          type: string
          enum:
          - ASSIGNED
          - ARRIVED
          - PICKED_UP
          - IN_PROGRESS
          - COMPLETED
          - ABNORMAL
        pickupLocation:
          $ref: '#/components/schemas/Location'
        destinationLocation:
          $ref: '#/components/schemas/Location'
    TripStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ARRIVED
          - PICKED_UP
          - IN_PROGRESS
          - COMPLETED
    Location:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
    RatingRequest:
      type: object
      required:
      - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
    Rating:
      type: object
      properties:
        ratingId:
          type: string
        tripId:
          type: string
        customerId:
          type: string
        driverId:
          type: string
        score:
          type: integer
        comment:
          type: string
    PageTrip:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
paths:
  /trips/{tripId}:
    get:
      tags:
      - Chuyến đi
      summary: Xem thông tin chuyến đi
      operationId: getTrip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Thông tin chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/status:
    patch:
      tags:
      - Chuyến đi
      summary: Cập nhật trạng thái chuyến đi
      operationId: updateTripStatus
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái chuyến đi thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Chuyển trạng thái không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/history:
    get:
      tags:
      - Chuyến đi
      summary: Xem lịch sử chuyến đi của khách hàng
      operationId: getTripHistory
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Lịch sử chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTrip'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /trips/{tripId}/rating:
    post:
      tags:
      - Chuyến đi
      summary: Đánh giá tài xế sau chuyến đi
      operationId: rateDriver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Tạo đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Chuyến đi không đủ điều kiện đánh giá hoặc đã được đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
