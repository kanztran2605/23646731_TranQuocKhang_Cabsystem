openapi: 3.0.0
info:
  title: API Hệ thống đặt xe CAB
  version: 1.0.0
  description: 'REST API cho hệ thống đặt xe CAB.

    Thiết kế API được xây dựng dựa trên yêu cầu chức năng SRS, Use Case,

    tiêu chí chấp nhận, tác nhân và quy tắc nghiệp vụ.

    '
servers:
- url: http://localhost:8080/api/v1
  description: Máy chủ phát triển cục bộ
tags:
- name: Thông báo
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Notification:
      type: object
      properties:
        notificationId:
          type: string
        userId:
          type: string
        type:
          type: string
        title:
          type: string
        message:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
paths:
  /notifications:
    get:
      tags:
      - Thông báo
      summary: Xem thông báo
      operationId: getThongBao
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thông báo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /notifications/{notificationId}/read:
    patch:
      tags:
      - Thông báo
      summary: Đánh dấu thông báo đã đọc
      operationId: markNotificationRead
      security:
      - bearerAuth: []
      parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Đánh dấu thông báo đã đọc thành công
        '404':
          $ref: '#/components/responses/NotFound'
