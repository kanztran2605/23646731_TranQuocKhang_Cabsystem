openapi: 3.0.3
info:
  title: CAB System API
  version: 2.0.0
  description: REST API cho hệ thống đặt xe CAB, bám theo SRS baseline và Rubric 30 tiêu chí.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway - môi trường local/demo
tags:
- name: Payments
  description: Payment, callback và idempotency
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Chữ ký callback của Payment Provider. Demo có thể dùng mock signature.
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu Access Token hoặc Access Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Người dùng đã xác thực nhưng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Vượt quá giới hạn request; Gateway trả HTTP 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Bắt buộc cho create payment; cùng key + cùng request phải trả lại kết quả cũ, không tạo payment mới/double
        charge.
      schema:
        type: string
        minLength: 8
        maxLength: 255
      example: PAY-CUS001-TRIP001
  schemas:
    CreatePaymentRequest:
      type: object
      required:
      - method
      properties:
        method:
          type: string
          enum:
          - CASH
          - ONLINE
          example: ONLINE
    Payment:
      type: object
      required:
      - paymentId
      - tripId
      - amount
      - method
      - status
      properties:
        paymentId:
          type: string
          example: PAY001
        tripId:
          type: string
          example: TRIP001
        amount:
          type: number
          format: double
          example: 50000
        method:
          type: string
          enum:
          - CASH
          - ONLINE
        status:
          type: string
          enum:
          - PENDING
          - COMPLETED
          - FAILED
        providerReference:
          type: string
          nullable: true
          example: MOCK123
        createdAt:
          type: string
          format: date-time
        failureReason:
          type: string
          nullable: true
          example: PROVIDER_DECLINED
        paidAt:
          type: string
          format: date-time
          nullable: true
    PaymentCallbackRequest:
      type: object
      required:
      - paymentId
      - status
      - providerReference
      properties:
        paymentId:
          type: string
          example: PAY001
        status:
          type: string
          enum:
          - COMPLETED
          - FAILED
        providerReference:
          type: string
          example: MOCK123
        failureReason:
          type: string
          nullable: true
          description: Lý do thất bại khi status = FAILED
          example: PROVIDER_DECLINED
    ReplayResponse:
      type: object
      properties:
        replayed:
          type: boolean
          example: true
        payment:
          $ref: '#/components/schemas/Payment'
    Error:
      type: object
      required:
      - code
      - message
      - timestamp
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
paths:
  /trips/{tripId}/payments:
    post:
      tags:
      - Payments
      summary: Tạo Payment cho Trip
      operationId: createPayment
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR06.04-FR06.10
      - FR06.12-FR06.13
      - UC12
      - AC12.01-AC12.08
      - AC12.10-AC12.11
      - AC-G10
      parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment mới được tạo
          headers:
            Idempotency-Replayed:
              schema:
                type: boolean
              description: false khi tạo mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '200':
          description: 'Request replay: trả lại Payment đã xử lý trước đó'
          headers:
            Idempotency-Replayed:
              schema:
                type: boolean
                example: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /payments/{paymentId}:
    get:
      tags:
      - Payments
      summary: Xem Payment
      operationId: getPayment
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Thông tin Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /payments/provider/callback:
    post:
      tags:
      - Payments
      summary: Nhận callback từ Payment Provider
      operationId: paymentProviderCallback
      security:
      - providerSignature: []
      x-srs-trace:
      - FR06.07
      - FR06.11
      - UC12
      - AC12.04
      - AC12.09
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCallbackRequest'
      responses:
        '200':
          description: Callback hợp lệ đã được xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /payments/{paymentId}/retry:
    post:
      tags:
      - Payments
      summary: Retry một Payment FAILED theo chính sách
      operationId: retryPayment
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PaymentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Retry đã được khởi tạo/hoặc kết quả cũ được trả lại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
