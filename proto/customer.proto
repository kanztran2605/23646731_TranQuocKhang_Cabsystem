syntax = "proto3";

package cab.customer.v1;

import "common/common.proto";

service CustomerService {
  rpc CreateCustomerProfile(CreateCustomerProfileRequest) returns (Customer);
  rpc GetCustomer(GetCustomerRequest) returns (Customer);
  rpc GetCustomerByUserId(GetCustomerByUserIdRequest) returns (Customer);
  rpc ValidateCustomer(ValidateCustomerRequest) returns (CustomerValidation);
}

message Customer {
  string customer_id = 1;
  string user_id = 2;
  string name = 3;
  optional string address = 4;
  string created_at = 5;
  string updated_at = 6;
}

message CreateCustomerProfileRequest {
  string user_id = 1;
  string name = 2;
  optional string address = 3;
  string correlation_id = 4;
}

message GetCustomerRequest {
  cab.common.v1.RequestContext context = 1;
  string customer_id = 2;
}

message GetCustomerByUserIdRequest {
  string user_id = 1;
  string correlation_id = 2;
}

message ValidateCustomerRequest {
  string customer_id = 1;
  string correlation_id = 2;
}

message CustomerValidation {
  bool valid = 1;
  string customer_id = 2;
  string user_id = 3;
}
