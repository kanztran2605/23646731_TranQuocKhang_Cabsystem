syntax = "proto3";

package cab.booking.v1;

import "common/common.proto";

service BookingService {
  rpc CreateBooking(CreateBookingRequest) returns (Booking);
  rpc GetBooking(GetBookingRequest) returns (Booking);
  rpc ListMyBookings(ListMyBookingsRequest) returns (BookingPage);
  rpc ListMyOffers(ListMyOffersRequest) returns (OfferList);
  rpc AcceptOffer(AcceptOfferRequest) returns (AcceptOfferResponse);
}

message Booking {
  string booking_id = 1;
  string customer_id = 2;
  cab.common.v1.Location pickup = 3;
  cab.common.v1.Location destination = 4;
  string vehicle_type = 5;
  string status = 6; // SEARCHING | ASSIGNED | NO_DRIVER_FOUND
  optional string offer_id = 7;
  optional string driver_id = 8;
  optional string created_at = 9;
  optional string assigned_at = 10;
}

message CreateBookingRequest {
  cab.common.v1.RequestContext context = 1;
  cab.common.v1.Location pickup = 2;
  cab.common.v1.Location destination = 3;
  string vehicle_type = 4;
}

message GetBookingRequest {
  cab.common.v1.RequestContext context = 1;
  string booking_id = 2;
}

message ListMyBookingsRequest {
  cab.common.v1.RequestContext context = 1;
  int32 page = 2;
  int32 limit = 3;
}

message BookingPage {
  int32 page = 1;
  int32 limit = 2;
  int64 total = 3;
  repeated Booking items = 4;
}

message Offer {
  string offer_id = 1;
  string booking_id = 2;
  string driver_id = 3;
  optional string vehicle_id = 4;
  string status = 5; // OPEN | ACCEPTED
  string created_at = 6;
  optional string accepted_at = 7;
}

message ListMyOffersRequest {
  cab.common.v1.RequestContext context = 1;
}

message OfferList {
  repeated Offer items = 1;
}

message AcceptOfferRequest {
  cab.common.v1.RequestContext context = 1;
  string offer_id = 2;
}

message AcceptOfferResponse {
  string offer_id = 1;
  string booking_id = 2;
  string offer_status = 3; // ACCEPTED
  bool trip_pending = 4; // trip is created asynchronously from driver.accepted
}
