syntax = "proto3";

package cab.trip.v1;

import "common/common.proto";

service TripService {
  rpc GetTrip(
    GetTripRequest
  ) returns (Trip);

  rpc UpdateTripStatus(
    UpdateTripStatusRequest
  ) returns (Trip);

  rpc CancelTrip(
    CancelTripRequest
  ) returns (Trip);

  rpc GetTripStatusHistory(
    GetTripStatusHistoryRequest
  ) returns (TripStatusHistoryResponse);

  rpc GetTripByBooking(
    GetTripByBookingRequest
  ) returns (Trip);

  rpc GetActiveTrips(
    GetActiveTripsRequest
  ) returns (TripListResponse);

  rpc GetAbnormalTrips(
    GetAbnormalTripsRequest
  ) returns (TripListResponse);

  rpc ResolveAbnormalTrip(
    ResolveAbnormalTripRequest
  ) returns (Trip);

  // Internal synchronous contract:
  // review-service -> trip-service
  rpc ValidateCompletedTrip(
    ValidateCompletedTripRequest
  ) returns (CompletedTripValidation);
}

message Trip {
  string trip_id = 1;
  string booking_id = 2;
  string customer_id = 3;
  string driver_id = 4;
  string vehicle_id = 5;
  string vehicle_type_id = 6;

  string status = 7;
  // ASSIGNED
  // ARRIVED
  // PICKED_UP
  // IN_PROGRESS
  // COMPLETED
  // CANCELED

  optional double distance_km = 8;
  optional double trip_distance = 9;

  optional string cancel_reason = 10;
  optional string canceled_at = 11;
  optional string completed_at = 12;

  optional string estimated_arrival_at = 13;

  optional string assigned_at = 14;
  optional string arrived_at = 15;
  optional string picked_up_at = 16;
  optional string started_at = 17;

  bool abnormal_flag = 18;
  optional string abnormal_reason = 19;
}

message GetTripRequest {
  cab.common.v1.RequestContext context = 1;
  string trip_id = 2;
}

message UpdateTripStatusRequest {
  cab.common.v1.RequestContext context = 1;
  string trip_id = 2;

  string status = 3;
  // ARRIVED | PICKED_UP | IN_PROGRESS | COMPLETED
}

message CancelTripRequest {
  cab.common.v1.RequestContext context = 1;
  string trip_id = 2;
  string reason = 3;
}

message GetTripStatusHistoryRequest {
  cab.common.v1.RequestContext context = 1;
  string trip_id = 2;
}

message TripStatusHistoryItem {
  string history_id = 1;
  string trip_id = 2;

  optional string from_status = 3;
  string to_status = 4;

  optional string changed_by_user_id = 5;
  optional string reason = 6;

  string changed_at = 7;
}

message TripStatusHistoryResponse {
  repeated TripStatusHistoryItem items = 1;
}

message GetTripByBookingRequest {
  cab.common.v1.RequestContext context = 1;
  string booking_id = 2;
}

message GetActiveTripsRequest {
  cab.common.v1.RequestContext context = 1;
}

message GetAbnormalTripsRequest {
  cab.common.v1.RequestContext context = 1;
}

message TripListResponse {
  repeated Trip items = 1;
}

message ResolveAbnormalTripRequest {
  cab.common.v1.RequestContext context = 1;
  string trip_id = 2;
  string resolution = 3;
  string note = 4;
}

message ValidateCompletedTripRequest {
  string trip_id = 1;
  string correlation_id = 2;
}

message CompletedTripValidation {
  string trip_id = 1;
  string booking_id = 2;
  string customer_id = 3;
  string driver_id = 4;
  string status = 5;
  bool completed = 6;
}