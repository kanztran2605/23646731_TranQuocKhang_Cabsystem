syntax = "proto3";

package cab.trip.v1;

import "common/common.proto";

service TripService {
  rpc GetTrip(GetTripRequest) returns (Trip);
  rpc GetTripByBooking(GetTripByBookingRequest) returns (Trip);
  rpc UpdateTripStatus(UpdateTripStatusRequest) returns (Trip);
  rpc UpdateTripLocation(UpdateTripLocationRequest) returns (TripLocation);
  rpc CancelTrip(CancelTripRequest) returns (Trip);
  rpc GetTripStatusHistory(GetTripStatusHistoryRequest) returns (TripStatusHistoryResponse);
  rpc ValidateCompletedTrip(ValidateCompletedTripRequest) returns (CompletedTripValidation);
}

message Trip {
  string trip_id = 1;
  string booking_id = 2;
  string customer_id = 3;
  string driver_id = 4;
  string vehicle_id = 5;
  string status = 6; // ASSIGNED | ARRIVED | IN_PROGRESS | COMPLETED | CANCELED
  bool paid = 7;
  optional string cancel_reason = 8;
  string created_at = 9;
  string updated_at = 10;
  optional string completed_at = 11;
  optional string canceled_at = 12;
}

message GetTripRequest {
  cab.common.v1.RequestContext context = 1;
  string trip_id = 2;
}

message GetTripByBookingRequest {
  cab.common.v1.RequestContext context = 1;
  string booking_id = 2;
}

message UpdateTripStatusRequest {
  cab.common.v1.RequestContext context = 1;
  string trip_id = 2;
  string status = 3; // ARRIVED | IN_PROGRESS | COMPLETED
}

message UpdateTripLocationRequest {
  cab.common.v1.RequestContext context = 1;
  string trip_id = 2;
  double latitude = 3;
  double longitude = 4;
}

message TripLocation {
  string location_id = 1;
  string trip_id = 2;
  double latitude = 3;
  double longitude = 4;
  string recorded_at = 5;
}

message CancelTripRequest {
  cab.common.v1.RequestContext context = 1;
  string trip_id = 2;
  string reason = 3;
}

message GetTripStatusHistoryRequest {
  cab.common.v1.RequestContext context = 1;
  string trip_id = 2;
}

message TripStatusHistoryItem {
  string history_id = 1;
  string trip_id = 2;
  optional string from_status = 3;
  string to_status = 4;
  string changed_at = 5;
}

message TripStatusHistoryResponse {
  repeated TripStatusHistoryItem items = 1;
}

message ValidateCompletedTripRequest {
  string trip_id = 1;
  string correlation_id = 2;
}

message CompletedTripValidation {
  string trip_id = 1;
  string booking_id = 2;
  string customer_id = 3;
  string driver_id = 4;
  bool completed = 5;
  string status = 6;
  string customer_user_id = 7; // logical owner identity for Review validation
  string driver_user_id = 8;
}
