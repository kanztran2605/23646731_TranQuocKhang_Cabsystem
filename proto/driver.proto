syntax = "proto3";

package cab.driver.v1;

import "common/common.proto";

service DriverService {
  // Gateway orchestration for POST /auth/drivers/register
  // after OTP + Identity creation succeeds.
  rpc RegisterDriverProfile(
    RegisterDriverProfileRequest
  ) returns (DriverRegistrationResult);

  rpc GetMyDriverProfile(
    GetMyDriverProfileRequest
  ) returns (Driver);

  // Gateway composition for PUT /users/me
  // when the current role is DRIVER.
  rpc UpdateMyDriverProfile(
    UpdateMyDriverProfileRequest
  ) returns (Driver);

  rpc GetDriverById(
    GetDriverByIdRequest
  ) returns (DriverPublicProfile);

  rpc UpdateDriver(
    UpdateDriverRequest
  ) returns (Driver);

  rpc GetNearbyDrivers(
    GetNearbyDriversRequest
  ) returns (PageNearbyDriver);

  rpc ListDrivers(
    ListDriversRequest
  ) returns (DriverListResponse);

  rpc UpdateMyAvailability(
    UpdateMyAvailabilityRequest
  ) returns (Driver);

  rpc UpdateMyLocation(
    UpdateMyLocationRequest
  ) returns (DriverLocation);

  rpc GetPendingDriverApplications(
    GetPendingDriverApplicationsRequest
  ) returns (PagePendingDriverApplications);

  rpc ApproveOrRejectDriver(
    ApproveOrRejectDriverRequest
  ) returns (DriverApprovalResult);

  rpc ListVehicles(
    ListVehiclesRequest
  ) returns (VehicleListResponse);

  rpc CreateVehicle(
    CreateVehicleRequest
  ) returns (Vehicle);

  rpc UpdateVehicle(
    UpdateVehicleRequest
  ) returns (Vehicle);

  rpc ListVehicleTypes(
    ListVehicleTypesRequest
  ) returns (VehicleTypeListResponse);

  // Internal synchronous contracts.
  // booking-service / trip-service can resolve a Driver
  // from authenticated userId without reading driver_db directly.
  rpc GetDriverByUserId(
    GetDriverByUserIdRequest
  ) returns (Driver);

  // booking-service -> driver-service
  rpc FindEligibleDrivers(
    FindEligibleDriversRequest
  ) returns (EligibleDriverListResponse);

  // trip-service -> driver-service
  rpc GetDriverLocation(
    GetDriverLocationRequest
  ) returns (DriverLocation);
}

message VehicleRegistration {
  string vehicle_type_id = 1;
  string license_plate = 2;
  optional string brand = 3;
  optional string model = 4;
}

message RegisterDriverProfileRequest {
  string user_id = 1;
  string full_name = 2;
  string driver_license = 3;
  VehicleRegistration vehicle = 4;
  string correlation_id = 5;
}

message DriverRegistrationResult {
  string driver_id = 1;
  string user_id = 2;
  string approval_status = 3; // PENDING_APPROVAL
  optional string message = 4;
}

message Driver {
  string driver_id = 1;
  string user_id = 2;
  string full_name = 3;

  // Only returned to roles allowed to see sensitive Driver data.
  optional string driver_license = 4;

  string approval_status = 5;
  // PENDING_APPROVAL | APPROVED | REJECTED

  string availability_status = 6;
  // OFFLINE | AVAILABLE | BUSY

  optional string address = 7;
  optional string date_of_birth = 8;
}

message VehicleSummary {
  string vehicle_type_id = 1;
  optional string brand = 2;
  optional string model = 3;
  string license_plate = 4;
}

message DriverPublicProfile {
  string driver_id = 1;
  optional string full_name = 2;
  optional string availability_status = 3;
  optional VehicleSummary vehicle = 4;
}

message GetMyDriverProfileRequest {
  cab.common.v1.RequestContext context = 1;
}

message GetDriverByIdRequest {
  cab.common.v1.RequestContext context = 1;
  string driver_id = 2;
}

message UpdateMyDriverProfileRequest {
  cab.common.v1.RequestContext context = 1;
  optional string full_name = 2;
  optional string address = 3;
  optional string date_of_birth = 4;
}

message UpdateDriverRequest {
  cab.common.v1.RequestContext context = 1;
  string driver_id = 2;
  optional string full_name = 3;
  optional string address = 4;
  optional string date_of_birth = 5;
  optional string driver_license = 6;
}

message GetNearbyDriversRequest {
  cab.common.v1.RequestContext context = 1;
  double latitude = 2;
  double longitude = 3;
  double radius_km = 4;
  int32 page = 5;
  int32 limit = 6;
}

message NearbyDriver {
  string driver_id = 1;
  optional string full_name = 2;
  optional string availability_status = 3;
  optional VehicleSummary vehicle = 4;
  double latitude = 5;
  double longitude = 6;
  double distance_km = 7;
}

message PageNearbyDriver {
  int32 page = 1;
  int32 limit = 2;
  int64 total = 3;
  repeated NearbyDriver items = 4;
}

message ListDriversRequest {
  cab.common.v1.RequestContext context = 1;
  optional string approval_status = 2;
  optional string availability_status = 3;
  optional string vehicle_type_id = 4;
  int32 page = 5;
  int32 limit = 6;
}

message DriverListResponse {
  repeated Driver items = 1;
}

message UpdateMyAvailabilityRequest {
  cab.common.v1.RequestContext context = 1;
  bool online = 2;
}

message UpdateMyLocationRequest {
  cab.common.v1.RequestContext context = 1;
  double latitude = 2;
  double longitude = 3;
}

message DriverLocation {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  optional string recorded_at = 4;
}

message GetPendingDriverApplicationsRequest {
  cab.common.v1.RequestContext context = 1;
  int32 page = 2;
  int32 limit = 3;
}

message DriverApplicationSummary {
  string application_id = 1;
  string driver_id = 2;
  optional string full_name = 3;
  optional string vehicle_id = 4;
  string approval_status = 5; // PENDING_APPROVAL
  string submitted_at = 6;
}

message PagePendingDriverApplications {
  int32 page = 1;
  int32 limit = 2;
  int64 total = 3;
  repeated DriverApplicationSummary items = 4;
}

message ApproveOrRejectDriverRequest {
  cab.common.v1.RequestContext context = 1;
  string driver_id = 2;
  string decision = 3; // APPROVED | REJECTED
  optional string reason = 4;
}

message DriverApprovalResult {
  string driver_id = 1;
  string approval_status = 2;
  string updated_at = 3;
}

message Vehicle {
  string vehicle_id = 1;
  string driver_id = 2;
  string vehicle_type_id = 3;
  string status = 4; // ACTIVE | INACTIVE
  string license_plate = 5;
  optional string brand = 6;
  optional string model = 7;
}

message ListVehiclesRequest {
  cab.common.v1.RequestContext context = 1;
}

message VehicleListResponse {
  repeated Vehicle items = 1;
}

message CreateVehicleRequest {
  cab.common.v1.RequestContext context = 1;
  string driver_id = 2;
  string vehicle_type_id = 3;
  string license_plate = 4;
  optional string brand = 5;
  optional string model = 6;
}

message UpdateVehicleRequest {
  cab.common.v1.RequestContext context = 1;
  string vehicle_id = 2;
  string driver_id = 3;
  string vehicle_type_id = 4;
  string license_plate = 5;
  optional string brand = 6;
  optional string model = 7;
}

message VehicleType {
  string vehicle_type_id = 1;
  string name = 2;
  optional string description = 3;
  string status = 4; // ACTIVE | INACTIVE
}

message ListVehicleTypesRequest {
  cab.common.v1.RequestContext context = 1;
}

message VehicleTypeListResponse {
  repeated VehicleType items = 1;
}

message GetDriverByUserIdRequest {
  string user_id = 1;
  string correlation_id = 2;
}

message FindEligibleDriversRequest {
  double pickup_latitude = 1;
  double pickup_longitude = 2;
  double radius_km = 3;
  string vehicle_type_id = 4;
  int32 page = 5;
  int32 limit = 6;
  string correlation_id = 7;
}

message EligibleDriver {
  string driver_id = 1;
  string vehicle_id = 2;
  string vehicle_type_id = 3;
  double latitude = 4;
  double longitude = 5;
  double distance_km = 6;
}

message EligibleDriverListResponse {
  repeated EligibleDriver items = 1;
}

message GetDriverLocationRequest {
  string driver_id = 1;
  string correlation_id = 2;
}