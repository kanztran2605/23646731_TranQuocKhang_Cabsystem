syntax = "proto3";

package cab.driver.v1;

import "common/common.proto";

service DriverService {
  rpc RequestOtp(RequestOtpRequest) returns (OtpResponse);
  rpc RegisterDriver(RegisterDriverRequest) returns (Driver);
  rpc GetDriver(GetDriverRequest) returns (Driver);
  rpc GetDriverByUserId(GetDriverByUserIdRequest) returns (Driver);
  rpc ListPendingDrivers(ListPendingDriversRequest) returns (DriverPage);
  rpc ReviewDriverApproval(ReviewDriverApprovalRequest) returns (Driver);
  rpc SetAvailability(SetAvailabilityRequest) returns (Driver);
  rpc UpdateLocation(UpdateLocationRequest) returns (DriverLocation);
  rpc GetNearbyDrivers(GetNearbyDriversRequest) returns (DriverPage);
  rpc FindEligibleDrivers(FindEligibleDriversRequest) returns (EligibleDriverList);
  // Internal Booking -> Driver assignment; never exposed as public REST.
  rpc MarkBusyForAssignment(MarkBusyForAssignmentRequest) returns (Driver);
  rpc GetDriverLocation(GetDriverLocationRequest) returns (DriverLocation);
  rpc ListVehicleTypes(ListVehicleTypesRequest) returns (VehicleTypeList);
}

message RequestOtpRequest {
  string email = 1;
  string correlation_id = 2;
}

message OtpResponse {
  string otp = 1; // demo value from ENV, default 123
}

message RegisterDriverRequest {
  cab.common.v1.RequestContext context = 1;
  string user_id = 2;
  string otp = 3;
  string name = 4;
  string vehicle_type = 5;
  string license_plate = 6;
  optional string brand = 7;
  optional string model = 8;
  optional string driver_license = 9; // encrypted at rest by driver-service
}

message Driver {
  string driver_id = 1;
  string user_id = 2;
  string name = 3;
  string approval_status = 4; // PENDING_APPROVAL | APPROVED | REJECTED
  string availability_status = 5; // OFFLINE | AVAILABLE | BUSY
  Vehicle vehicle = 6;
  DriverLocation location = 7;
  optional double distance_km = 8;
}

message Vehicle {
  string vehicle_id = 1;
  string driver_id = 2;
  string vehicle_type = 3;
  string license_plate = 4;
  optional string brand = 5;
  optional string model = 6;
  string status = 7; // ACTIVE | INACTIVE
}

message DriverLocation {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  string recorded_at = 4;
}

message GetDriverRequest {
  cab.common.v1.RequestContext context = 1;
  string driver_id = 2;
}

message GetDriverByUserIdRequest {
  string user_id = 1;
  string correlation_id = 2;
}

message ListPendingDriversRequest {
  cab.common.v1.RequestContext context = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ReviewDriverApprovalRequest {
  cab.common.v1.RequestContext context = 1;
  string driver_id = 2;
  string approval_status = 3; // APPROVED | REJECTED
}

message SetAvailabilityRequest {
  cab.common.v1.RequestContext context = 1;
  bool online = 2;
}

message MarkBusyForAssignmentRequest {
  cab.common.v1.RequestContext context = 1;
  string driver_id = 2;
}

message UpdateLocationRequest {
  cab.common.v1.RequestContext context = 1;
  double latitude = 2;
  double longitude = 3;
}

message GetNearbyDriversRequest {
  cab.common.v1.RequestContext context = 1;
  double latitude = 2;
  double longitude = 3;
  double radius_km = 4;
  int32 page = 5;
  int32 limit = 6;
}

message DriverPage {
  int32 page = 1;
  int32 limit = 2;
  int64 total = 3;
  repeated Driver items = 4;
}

message FindEligibleDriversRequest {
  double pickup_latitude = 1;
  double pickup_longitude = 2;
  double radius_km = 3;
  string vehicle_type = 4;
  int32 limit = 5;
  string correlation_id = 6;
}

message EligibleDriver {
  string driver_id = 1;
  string vehicle_id = 2;
  string vehicle_type = 3;
  double latitude = 4;
  double longitude = 5;
  double distance_km = 6;
  string user_id = 7; // logical recipient identity for Booking events
}

message EligibleDriverList {
  repeated EligibleDriver items = 1;
}

message GetDriverLocationRequest {
  string driver_id = 1;
  string correlation_id = 2;
}

message VehicleType {
  string vehicle_type = 1;
  string name = 2;
}

message ListVehicleTypesRequest {
  cab.common.v1.RequestContext context = 1;
}

message VehicleTypeList {
  repeated VehicleType items = 1;
}
