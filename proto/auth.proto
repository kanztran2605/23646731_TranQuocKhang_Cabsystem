syntax = "proto3";

package cab.auth.v1;

import "common/common.proto";

service AuthService {
  rpc CreateAccount(CreateAccountRequest) returns (Account);
  rpc Login(LoginRequest) returns (LoginResponse);
  // Chỉ Gateway hoàn tất đăng ký sau khi Driver đã lưu hồ sơ.
  rpc CompleteDriverRegistration(CompleteDriverRegistrationRequest) returns (Account);
  // Chỉ đọc, ADMIN + DEMO_SECURITY_ENABLED=true; không trả hash thật.
  rpc GetPasswordAtRestEvidence(GetPasswordAtRestEvidenceRequest) returns (PasswordAtRestEvidence);
}

message GetPasswordAtRestEvidenceRequest { cab.common.v1.RequestContext context = 1; }
message PasswordAtRestEvidence {
  string status = 1;
  string algorithm = 2;
  int32 checked_count = 3;
  int32 bcrypt_count = 4;
  int32 invalid_count = 5;
  string masked_format = 6;
  string plaintext_check = 7;
  string scope = 8;
}

message CreateAccountRequest {
  string email = 1;
  string password = 2;
  string role = 3; // CUSTOMER | DRIVER | ADMIN
  optional string registration_id = 4;
}

message CompleteDriverRegistrationRequest {
  string user_id = 1;
  string registration_id = 2;
}

message Account {
  string user_id = 1;
  string email = 2;
  string role = 3;
  string status = 4; // ACTIVE | INACTIVE
  string created_at = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string user_id = 2;
  string role = 3;
  int64 expires_in_seconds = 4;
}
