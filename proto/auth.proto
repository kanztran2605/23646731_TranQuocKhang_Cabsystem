syntax = "proto3";

package cab.auth.v1;

import "common/common.proto";

service AuthService {
  rpc CreateAccount(CreateAccountRequest) returns (Account);
  rpc Login(LoginRequest) returns (LoginResponse);
}

message CreateAccountRequest {
  string email = 1;
  string password = 2;
  string role = 3; // CUSTOMER | DRIVER | ADMIN
}

message Account {
  string user_id = 1;
  string email = 2;
  string role = 3;
  string status = 4; // ACTIVE | INACTIVE
  string created_at = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string user_id = 2;
  string role = 3;
  int64 expires_in_seconds = 4;
}
