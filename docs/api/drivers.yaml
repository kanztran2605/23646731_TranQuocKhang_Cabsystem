openapi: 3.0.3
info:
  title: CAB System API - Driver & Vehicle Management
  version: 4.0.0
  description: 'Driver onboarding OTP mock 123, profile/vehicle, approval, availability, location và nearby.

    Không SMS/Map provider thật. Gateway có thể orchestration Account DRIVER với Auth mà không tạo service-to-service gRPC
    mới.'
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway local/demo
tags:
- name: Driver
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Did:
      name: did
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
  schemas:
    OtpRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          example: newd@d.co
    OtpResponse:
      type: object
      required:
      - otp
      properties:
        otp:
          type: string
          example: '123'
          description: Demo only; lấy từ ENV
    DriverRegisterRequest:
      type: object
      required:
      - email
      - pw
      - otp
      - name
      - vt
      - plate
      properties:
        email:
          type: string
          format: email
          example: newd@d.co
        pw:
          type: string
          example: '123'
        otp:
          type: string
          example: '123'
        name:
          type: string
          example: D
        vt:
          type: string
          example: CAR
        plate:
          type: string
          example: 51A1
    Driver:
      type: object
      required:
      - did
      - uid
      - ap
      - av
      properties:
        did:
          type: integer
          format: int64
          example: 1
        uid:
          type: integer
          format: int64
          example: 2
        name:
          type: string
          example: D
        ap:
          type: string
          enum:
          - PENDING_APPROVAL
          - APPROVED
          - REJECTED
          example: APPROVED
        av:
          type: string
          enum:
          - OFFLINE
          - AVAILABLE
          - BUSY
          example: AVAILABLE
        vid:
          type: integer
          format: int64
          nullable: true
          example: 1
        vt:
          type: string
          nullable: true
          example: CAR
        plate:
          type: string
          nullable: true
          example: 51A1
        lat:
          type: number
          format: double
          nullable: true
          example: 10.76
        lng:
          type: number
          format: double
          nullable: true
          example: 106.68
        km:
          type: number
          format: double
          nullable: true
          example: 0.4
    DriverRegisterResponse:
      type: object
      required:
      - uid
      - did
      - ap
      properties:
        uid:
          type: integer
          format: int64
          example: 5
        did:
          type: integer
          format: int64
          example: 5
        ap:
          type: string
          example: PENDING_APPROVAL
    ApprovalRequest:
      type: object
      required:
      - ap
      properties:
        ap:
          type: string
          enum:
          - APPROVED
          - REJECTED
          example: APPROVED
    AvailabilityRequest:
      type: object
      required:
      - 'on'
      properties:
        'on':
          type: boolean
          example: true
    LocationRequest:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          format: double
          example: 10.76
        lng:
          type: number
          format: double
          example: 106.68
    NearbyPage:
      type: object
      required:
      - page
      - limit
      - items
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 5
        items:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /drivers/otp:
    post:
      tags:
      - Driver
      summary: Yêu cầu OTP Driver demo
      operationId: requestDriverOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: OTP demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResponse'
        '400':
          description: Request không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drivers/register:
    post:
      tags:
      - Driver
      summary: Đăng ký Driver + Vehicle bằng OTP mock
      operationId: registerDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRegisterRequest'
      responses:
        '201':
          description: Driver PENDING_APPROVAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRegisterResponse'
        '400':
          description: OTP/request không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email/plate đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drivers/pending-approval:
    get:
      tags:
      - Driver
      summary: Danh sách Driver đang chờ duyệt
      operationId: listPendingDrivers
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
          example: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          example: 5
      responses:
        '200':
          description: Danh sách Driver PENDING_APPROVAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyPage'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drivers/{did}:
    get:
      tags:
      - Driver
      summary: Lấy Driver theo ID (Admin)
      operationId: getDriverById
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/Did'
      responses:
        '200':
          description: Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Sai role; dùng Customer token cho smoke #28'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drivers/nearby:
    get:
      tags:
      - Driver
      summary: Driver quanh tọa độ trong radius demo
      operationId: getNearbyDrivers
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          format: double
          example: 10.76
      - name: lng
        in: query
        required: true
        schema:
          type: number
          format: double
          example: 106.68
      - name: r
        in: query
        required: false
        schema:
          type: number
          format: double
          default: 1
          example: 1
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          example: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          example: 5
      responses:
        '200':
          description: Danh sách Driver theo radius/page/limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyPage'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drivers/{did}/approval:
    patch:
      tags:
      - Driver
      summary: Approve/Reject Driver
      operationId: reviewDriverApproval
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/Did'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Đã cập nhật approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          description: Approval không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Chỉ ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drivers/me/availability:
    patch:
      tags:
      - Driver
      summary: Driver Online/Offline
      operationId: setDriverAvailability
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
      responses:
        '200':
          description: Availability đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '409':
          description: Driver chưa APPROVED hoặc đang BUSY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Chỉ DRIVER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drivers/me/location:
    put:
      tags:
      - Driver
      summary: Cập nhật vị trí Driver
      operationId: updateDriverLocation
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Location đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          description: lat/lng không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Chỉ DRIVER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
