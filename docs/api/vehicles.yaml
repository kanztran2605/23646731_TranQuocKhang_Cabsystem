openapi: 3.0.3
info:
  title: CAB System API - Vehicles
  version: 3.0.0
  description: Public REST contract qua API Gateway cho Vehicle thuộc Driver & Vehicle Management. Vehicle phải liên kết Driver
    và Vehicle Type hợp lệ; không dùng physical FK xuyên service.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway - môi trường local/demo
tags:
- name: Xe
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Người dùng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu Access Token hoặc Access Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Vượt quá giới hạn request; Gateway trả HTTP 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
        driverId:
          type: string
        vehicleTypeId:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          example: ACTIVE
        licensePlate:
          type: string
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Vios
    VehicleRequest:
      type: object
      required:
      - driverId
      - vehicleTypeId
      - licensePlate
      properties:
        driverId:
          type: string
        vehicleTypeId:
          type: string
        licensePlate:
          type: string
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Vios
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
    VehicleType:
      type: object
      required:
      - vehicleTypeId
      - name
      - status
      properties:
        vehicleTypeId:
          type: string
          example: CAR_4_SEATS
        name:
          type: string
          example: Car 4 seats
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          example: ACTIVE
paths:
  /vehicles:
    get:
      tags:
      - Xe
      summary: Xem danh sách xe
      operationId: listXe
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách xe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Xe
      summary: Tạo xe
      operationId: createVehicle
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Tạo xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /vehicles/{vehicleId}:
    put:
      tags:
      - Xe
      summary: Cập nhật xe
      operationId: updateVehicle
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Cập nhật xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /vehicle-types:
    get:
      tags:
      - Xe
      summary: Xem danh sách Vehicle Type khả dụng
      operationId: listVehicleTypes
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách Vehicle Type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleType'
        '401':
          $ref: '#/components/responses/Unauthorized'
