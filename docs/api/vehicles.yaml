openapi: 3.0.3
info:
  title: CAB System API - Vehicle Types
  version: 4.0.0
  description: Hỗ trợ dữ liệu Vehicle Type tối thiểu cho Driver onboarding và Booking. Không có standalone Vehicle CRUD trong
    Demo MVP.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway local/demo
tags:
- name: Vehicle
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    VehicleType:
      type: object
      required:
      - vt
      - name
      properties:
        vt:
          type: string
          example: CAR
        name:
          type: string
          example: Car
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /vehicle-types:
    get:
      tags:
      - Vehicle
      summary: Danh sách Vehicle Type demo
      operationId: listVehicleTypes
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách Vehicle Type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleType'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
