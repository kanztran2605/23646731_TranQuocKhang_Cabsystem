openapi: 3.0.3
info:
  title: CAB System Gateway Health API
  version: 4.0.0
  description: 'Health endpoints tại API Gateway phục vụ rubric #6.'
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway local/demo
tags:
- name: Health
components:
  schemas:
    Health:
      type: object
      required:
      - s
      properties:
        s:
          type: string
          example: UP
    ServiceHealth:
      type: object
      required:
      - name
      - s
      properties:
        name:
          type: string
          example: booking-service
        s:
          type: string
          enum:
          - UP
          - DOWN
          example: UP
    ServicesHealth:
      type: object
      required:
      - s
      - services
      properties:
        s:
          type: string
          example: UP
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceHealth'
paths:
  /health:
    get:
      tags:
      - Health
      summary: Gateway liveness
      operationId: health
      responses:
        '200':
          description: Gateway sống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      tags:
      - Health
      summary: Gateway readiness
      operationId: ready
      responses:
        '200':
          description: Gateway + dependency tối thiểu ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Chưa ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/services:
    get:
      tags:
      - Health
      summary: Health của đúng 8 business services
      operationId: serviceHealth
      responses:
        '200':
          description: Tổng hợp 8 service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesHealth'
