openapi: 3.0.3
info:
  title: CAB System API - Notification
  version: 4.0.0
  description: Notification Service consume RabbitMQ events và lưu MongoDB. Không SMS/Email/Push provider thật.
servers:
- url: http://localhost:8080/api
  description: API Gateway local/demo
tags:
- name: Notification
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Notification:
      type: object
      required:
      - 'Notification ID'
      - 'Event ID'
      - 'User ID'
      - 'Type'
      - 'Reference'
      - 'Message'
      - 'Status'
      properties:
        'Notification ID':
          type: string
          example: 66f...
        'Event ID':
          type: string
          format: uuid
        'User ID':
          type: integer
          format: int64
          example: 1
        'Type':
          type: string
          example: PAYMENT_COMPLETED
        'Reference':
          type: string
          example: pid:1
        'Message':
          type: string
          example: Payment completed
        'Status':
          type: string
          enum:
          - SENT
          example: SENT
        'Created At':
          type: string
          format: date-time
    NotificationPage:
      type: object
      required:
      - 'Items'
      properties:
        'Items':
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /notifications:
    get:
      tags:
      - Notification
      summary: Notification của User hiện tại
      operationId: listNotifications
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          example: 5
      responses:
        '200':
          description: Danh sách Notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
