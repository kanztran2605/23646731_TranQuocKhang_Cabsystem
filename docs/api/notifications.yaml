openapi: 3.0.3
info:
  title: CAB System API - Notification
  version: 4.0.0
  description: Notification Service consume RabbitMQ events và lưu MongoDB. Không SMS/Email/Push provider thật.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway local/demo
tags:
- name: Notification
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Notification:
      type: object
      required:
      - nid
      - eid
      - uid
      - type
      - ref
      - msg
      - s
      properties:
        nid:
          type: string
          example: 66f...
        eid:
          type: string
          format: uuid
        uid:
          type: integer
          format: int64
          example: 1
        type:
          type: string
          example: PAYMENT_COMPLETED
        ref:
          type: string
          example: pid:1
        msg:
          type: string
          example: Payment completed
        s:
          type: string
          enum:
          - SENT
          example: SENT
        c_at:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /notifications:
    get:
      tags:
      - Notification
      summary: Notification của User hiện tại
      operationId: listNotifications
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          example: 5
      responses:
        '200':
          description: Danh sách Notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
