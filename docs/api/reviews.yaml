openapi: 3.0.3
info:
  title: CAB System API - Rating & Review
  version: 4.0.0
  description: Customer review Trip COMPLETED; Review Service validate Trip/ownership qua gRPC Trip link.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway local/demo
tags:
- name: Review
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Tid:
      name: tid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
  schemas:
    ReviewRequest:
      type: object
      required:
      - star
      properties:
        star:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        c:
          type: string
          maxLength: 255
          example: ok
    Review:
      type: object
      required:
      - rid
      - tid
      - cid
      - did
      - star
      properties:
        rid:
          type: integer
          example: 1
        tid:
          type: integer
          example: 1
        cid:
          type: integer
          example: 1
        did:
          type: integer
          example: 1
        star:
          type: integer
          example: 5
        c:
          type: string
          example: ok
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /trips/{tid}/reviews:
    post:
      tags:
      - Review
      summary: Customer review Trip đã COMPLETED
      operationId: createReview
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      x-owner-only: true
      parameters:
      - $ref: '#/components/parameters/Tid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Review đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: star/comment không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không sở hữu Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Trip chưa COMPLETED hoặc đã review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-internal-flow:
      - 'review-service -> trip-service gRPC: validate COMPLETED + ownership + Driver'
      - Persist one Review per Trip/Customer
