openapi: 3.0.3
info:
  title: CAB System API - Customer Management
  version: 4.0.0
  description: Customer Profile public contract qua Gateway. Customer data không chứa password/JWT.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway local/demo
tags:
- name: Customer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cid:
      name: cid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
  schemas:
    Customer:
      type: object
      required:
      - cid
      - uid
      - name
      properties:
        cid:
          type: integer
          format: int64
          example: 1
        uid:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: C
        addr:
          type: string
          nullable: true
          example: HCMC
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /customers/{cid}:
    get:
      tags:
      - Customer
      summary: Lấy Customer theo ID
      operationId: getCustomerById
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      - ADMIN
      x-owner-or-admin: true
      parameters:
      - $ref: '#/components/parameters/Cid'
      responses:
        '200':
          description: Customer Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền xem Customer này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
