openapi: 3.0.3
info:
  title: CAB System API - Reporting
  version: 3.0.0
  description: report-service sở hữu reporting_db và cung cấp Reporting Read Models được xây dựng từ Domain/Integration Events;
    không ghi trực tiếp vào database của service nguồn.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway - môi trường local/demo
tags:
- name: Báo cáo
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Forbidden:
      description: Người dùng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu Access Token hoặc Access Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Vượt quá giới hạn request; Gateway trả HTTP 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
    TripReport:
      type: object
      required:
      - from
      - to
      - totalTrips
      - completedTrips
      - canceledTrips
      - completionRate
      - cancellationRate
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalTrips:
          type: integer
          minimum: 0
          example: 100
        completedTrips:
          type: integer
          minimum: 0
          example: 82
        canceledTrips:
          type: integer
          minimum: 0
          example: 12
        completionRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.82
        cancellationRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.12
        generatedAt:
          type: string
          format: date-time
    RevenueReport:
      type: object
      required:
      - from
      - to
      - totalRevenue
      - successfulPayments
      - failedPayments
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalRevenue:
          type: number
          format: double
          example: 12500000
        successfulPayments:
          type: integer
          minimum: 0
          example: 80
        failedPayments:
          type: integer
          minimum: 0
          example: 5
        generatedAt:
          type: string
          format: date-time
        currency:
          type: string
          example: VND
    DriverPerformance:
      type: object
      required:
      - driverId
      - from
      - to
      - totalTrips
      - completedTrips
      - canceledTrips
      - completionRate
      - averageRating
      properties:
        driverId:
          type: string
          example: DRV001
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalTrips:
          type: integer
          minimum: 0
          example: 50
        completedTrips:
          type: integer
          minimum: 0
          example: 45
        canceledTrips:
          type: integer
          minimum: 0
          example: 3
        completionRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.9
        averageRating:
          type: number
          format: double
          minimum: 1
          maximum: 5
          example: 4.8
        generatedAt:
          type: string
          format: date-time
        cancellationRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.06
    DriverPerformanceList:
      type: array
      items:
        $ref: '#/components/schemas/DriverPerformance'
paths:
  /reports/trips:
    get:
      tags:
      - Báo cáo
      summary: Xem báo cáo hoạt động chuyến đi
      operationId: getTripReport
      security:
      - bearerAuth: []
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Báo cáo hoạt động chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-srs-trace:
      - FR10.01-FR10.07
      - UC19
  /reports/revenue:
    get:
      tags:
      - Báo cáo
      summary: Xem báo cáo doanh thu
      operationId: getRevenueReport
      security:
      - bearerAuth: []
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Revenue report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-srs-trace:
      - FR10.01-FR10.07
      - UC19
  /reports/drivers:
    get:
      tags:
      - Báo cáo
      summary: Xem báo cáo hiệu quả Driver
      operationId: getDriverPerformanceReport
      security:
      - bearerAuth: []
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: driverId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Báo cáo hiệu quả Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPerformanceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-srs-trace:
      - FR10.01-FR10.07
      - UC19
