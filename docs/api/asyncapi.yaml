asyncapi: 2.6.0
info:
  title: CAB System RabbitMQ Events
  version: 4.0.0
  description: 'Integration Events tối thiểu theo SRS/DDD FINAL. Exchange topic: cab.events. Consumer phải idempotent.'
servers:
  rabbitmq:
    url: rabbitmq:5672
    protocol: amqp
    description: RabbitMQ nội bộ Docker network
defaultContentType: application/json
x-rabbitmq-topology:
  exchange:
    name: cab.events
    type: topic
    durable: true
  queues:
  - name: payment.q
    bindings:
    - booking.created
    - trip.completed
  - name: trip.q
    bindings:
    - driver.accepted
    - payment.completed
  - name: driver.q
    bindings:
    - trip.canceled
    - trip.completed
  - name: notification.q
    bindings:
    - offer.created
    - driver.approval.changed
    - trip.status.changed
    - trip.canceled
    - payment.completed
channels:
  booking.created:
    publish:
      summary: Booking persist thành công; Payment Service tạo đúng một Payment PENDING.
      message:
        $ref: '#/components/messages/BookingCreated'
    x-producer: booking-service
    x-consumers:
    - payment-service
  offer.created:
    publish:
      summary: Booking tạo Offer cho Driver.
      message:
        $ref: '#/components/messages/OfferCreated'
    x-producer: booking-service
    x-consumers:
    - notification-service
  driver.accepted:
    publish:
      summary: Driver Accept Offer; Trip Service tạo Trip ASSIGNED.
      message:
        $ref: '#/components/messages/DriverAccepted'
    x-producer: booking-service
    x-consumers:
    - trip-service
  driver.approval.changed:
    publish:
      summary: Admin Approve/Reject Driver.
      message:
        $ref: '#/components/messages/DriverApprovalChanged'
    x-producer: driver-service
    x-consumers:
    - notification-service
  trip.status.changed:
    publish:
      summary: Trip chuyển state hợp lệ.
      message:
        $ref: '#/components/messages/TripStatusChanged'
    x-producer: trip-service
    x-consumers:
    - notification-service
  trip.canceled:
    publish:
      summary: Trip bị hủy; Driver được release và Notification được lưu.
      message:
        $ref: '#/components/messages/TripCanceled'
    x-producer: trip-service
    x-consumers:
    - driver-service
    - notification-service
  trip.completed:
    publish:
      summary: Trip hoàn thành; Driver AVAILABLE; Payment hiện có gắn tid + eligible=true.
      message:
        $ref: '#/components/messages/TripCompleted'
    x-producer: trip-service
    x-consumers:
    - driver-service
    - payment-service
  payment.completed:
    publish:
      summary: Payment hoàn tất; Trip paid=true và lưu Notification.
      message:
        $ref: '#/components/messages/PaymentCompleted'
    x-producer: payment-service
    x-consumers:
    - trip-service
    - notification-service
components:
  messages:
    BookingCreated:
      name: booking.created
      title: booking.created
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/BookingCreatedPayload'
    OfferCreated:
      name: offer.created
      title: offer.created
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/OfferCreatedPayload'
    DriverAccepted:
      name: driver.accepted
      title: driver.accepted
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/DriverAcceptedPayload'
    DriverApprovalChanged:
      name: driver.approval.changed
      title: driver.approval.changed
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/DriverApprovalChangedPayload'
    TripStatusChanged:
      name: trip.status.changed
      title: trip.status.changed
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/TripStatusChangedPayload'
    TripCanceled:
      name: trip.canceled
      title: trip.canceled
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/TripCanceledPayload'
    TripCompleted:
      name: trip.completed
      title: trip.completed
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/TripCompletedPayload'
    PaymentCompleted:
      name: payment.completed
      title: payment.completed
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/PaymentCompletedPayload'
  schemas:
    EventEnvelope:
      type: object
      required:
      - eventId
      - eventType
      - occurredAt
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
    BookingCreatedPayload:
      type: object
      required:
      - bid
      - cid
      - createdAt
      properties:
        bid:
          type: integer
          example: 6
        cid:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
    OfferCreatedPayload:
      type: object
      required:
      - oid
      - bid
      - did
      - createdAt
      properties:
        oid:
          type: integer
          example: 1
        bid:
          type: integer
          example: 6
        did:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
    DriverAcceptedPayload:
      type: object
      required:
      - bid
      - cid
      - did
      - vid
      - acceptedAt
      properties:
        bid:
          type: integer
          example: 6
        cid:
          type: integer
          example: 1
        did:
          type: integer
          example: 1
        vid:
          type: integer
          example: 1
        acceptedAt:
          type: string
          format: date-time
    DriverApprovalChangedPayload:
      type: object
      required:
      - did
      - uid
      - ap
      - changedAt
      properties:
        did:
          type: integer
          example: 5
        uid:
          type: integer
          example: 5
        ap:
          type: string
          enum:
          - APPROVED
          - REJECTED
          example: APPROVED
        changedAt:
          type: string
          format: date-time
    TripStatusChangedPayload:
      type: object
      required:
      - tid
      - cid
      - did
      - fromS
      - toS
      - changedAt
      properties:
        tid:
          type: integer
          example: 1
        cid:
          type: integer
          example: 1
        did:
          type: integer
          example: 1
        fromS:
          type: string
          nullable: true
          example: ASSIGNED
        toS:
          type: string
          example: ARRIVED
        changedAt:
          type: string
          format: date-time
    TripCanceledPayload:
      type: object
      required:
      - tid
      - cid
      - did
      - r
      - canceledAt
      properties:
        tid:
          type: integer
          example: 1
        cid:
          type: integer
          example: 1
        did:
          type: integer
          example: 1
        r:
          type: string
          example: x
        canceledAt:
          type: string
          format: date-time
    TripCompletedPayload:
      type: object
      required:
      - tid
      - bid
      - cid
      - did
      - completedAt
      properties:
        tid:
          type: integer
          example: 1
        bid:
          type: integer
          example: 6
        cid:
          type: integer
          example: 1
        did:
          type: integer
          example: 1
        completedAt:
          type: string
          format: date-time
    PaymentCompletedPayload:
      type: object
      required:
      - pid
      - bid
      - tid
      - cid
      - amt
      - paidAt
      properties:
        pid:
          type: integer
          example: 1
        bid:
          type: integer
          example: 6
        tid:
          type: integer
          example: 1
        cid:
          type: integer
          example: 1
        amt:
          type: number
          example: 50000
        paidAt:
          type: string
          format: date-time
