asyncapi: 2.6.0
info:
  title: CAB System RabbitMQ Events
  version: 5.0.0
  description: Canonical asynchronous contracts for the 8-service MVP. Consumers must be idempotent.
servers:
  rabbitmq:
    url: rabbitmq:5672
    protocol: amqp
    description: RabbitMQ inside the Docker network
defaultContentType: application/json
x-rabbitmq-topology:
  exchange:
    name: cab.events
    type: topic
    durable: true
  queues:
    - name: cab.payment.q
      bindings: [booking.created, trip.completed]
    - name: cab.trip.q
      bindings: [driver.accepted, payment.completed]
    - name: cab.driver.q
      bindings: [trip.canceled, trip.completed]
    - name: cab.notification.q
      bindings: [offer.created, driver.approval.changed, trip.status.changed, trip.canceled, payment.completed]
channels:
  booking.created:
    publish:
      message: { $ref: '#/components/messages/BookingCreated' }
    x-producer: booking-service
    x-consumers: [payment-service]
  offer.created:
    publish:
      message: { $ref: '#/components/messages/OfferCreated' }
    x-producer: booking-service
    x-consumers: [notification-service]
  driver.accepted:
    publish:
      message: { $ref: '#/components/messages/DriverAccepted' }
    x-producer: booking-service
    x-consumers: [trip-service]
  driver.approval.changed:
    publish:
      message: { $ref: '#/components/messages/DriverApprovalChanged' }
    x-producer: driver-service
    x-consumers: [notification-service]
  trip.status.changed:
    publish:
      message: { $ref: '#/components/messages/TripStatusChanged' }
    x-producer: trip-service
    x-consumers: [notification-service]
  trip.canceled:
    publish:
      message: { $ref: '#/components/messages/TripCanceled' }
    x-producer: trip-service
    x-consumers: [driver-service, notification-service]
  trip.completed:
    publish:
      message: { $ref: '#/components/messages/TripCompleted' }
    x-producer: trip-service
    x-consumers: [driver-service, payment-service]
  payment.completed:
    publish:
      message: { $ref: '#/components/messages/PaymentCompleted' }
    x-producer: payment-service
    x-consumers: [trip-service, notification-service]
components:
  messages:
    BookingCreated:
      name: booking.created
      payload:
        allOf:
          - { $ref: '#/components/schemas/EventEnvelope' }
          - type: object
            properties:
              payload: { $ref: '#/components/schemas/BookingCreatedPayload' }
    OfferCreated:
      name: offer.created
      payload:
        allOf:
          - { $ref: '#/components/schemas/EventEnvelope' }
          - type: object
            properties:
              payload: { $ref: '#/components/schemas/OfferCreatedPayload' }
    DriverAccepted:
      name: driver.accepted
      payload:
        allOf:
          - { $ref: '#/components/schemas/EventEnvelope' }
          - type: object
            properties:
              payload: { $ref: '#/components/schemas/DriverAcceptedPayload' }
    DriverApprovalChanged:
      name: driver.approval.changed
      payload:
        allOf:
          - { $ref: '#/components/schemas/EventEnvelope' }
          - type: object
            properties:
              payload: { $ref: '#/components/schemas/DriverApprovalChangedPayload' }
    TripStatusChanged:
      name: trip.status.changed
      payload:
        allOf:
          - { $ref: '#/components/schemas/EventEnvelope' }
          - type: object
            properties:
              payload: { $ref: '#/components/schemas/TripStatusChangedPayload' }
    TripCanceled:
      name: trip.canceled
      payload:
        allOf:
          - { $ref: '#/components/schemas/EventEnvelope' }
          - type: object
            properties:
              payload: { $ref: '#/components/schemas/TripCanceledPayload' }
    TripCompleted:
      name: trip.completed
      payload:
        allOf:
          - { $ref: '#/components/schemas/EventEnvelope' }
          - type: object
            properties:
              payload: { $ref: '#/components/schemas/TripCompletedPayload' }
    PaymentCompleted:
      name: payment.completed
      payload:
        allOf:
          - { $ref: '#/components/schemas/EventEnvelope' }
          - type: object
            properties:
              payload: { $ref: '#/components/schemas/PaymentCompletedPayload' }
  schemas:
    EventEnvelope:
      type: object
      required: [eventId, eventType, occurredAt, payload]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        payload: { type: object }
    BookingCreatedPayload:
      type: object
      required: [bookingId, customerId, createdAt]
      properties:
        bookingId: { type: string, example: '6' }
        customerId: { type: string, example: '1' }
        createdAt: { type: string, format: date-time }
    OfferCreatedPayload:
      type: object
      required: [offerId, bookingId, driverId, createdAt]
      properties:
        offerId: { type: string, example: '1' }
        bookingId: { type: string, example: '6' }
        driverId: { type: string, example: '1' }
        createdAt: { type: string, format: date-time }
    DriverAcceptedPayload:
      type: object
      required: [bookingId, customerId, driverId, vehicleId, acceptedAt]
      properties:
        bookingId: { type: string, example: '6' }
        customerId: { type: string, example: '1' }
        driverId: { type: string, example: '1' }
        vehicleId: { type: string, example: '1' }
        acceptedAt: { type: string, format: date-time }
    DriverApprovalChangedPayload:
      type: object
      required: [driverId, userId, approvalStatus, changedAt]
      properties:
        driverId: { type: string, example: '5' }
        userId: { type: string, example: '5' }
        approvalStatus: { type: string, enum: [APPROVED, REJECTED] }
        changedAt: { type: string, format: date-time }
    TripStatusChangedPayload:
      type: object
      required: [tripId, customerId, driverId, fromStatus, toStatus, changedAt]
      properties:
        tripId: { type: string, example: '1' }
        customerId: { type: string, example: '1' }
        driverId: { type: string, example: '1' }
        fromStatus:
          type: string
          nullable: true
          enum: [ASSIGNED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELED]
        toStatus:
          type: string
          enum: [ASSIGNED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELED]
        changedAt: { type: string, format: date-time }
    TripCanceledPayload:
      type: object
      required: [tripId, customerId, driverId, reason, canceledAt]
      properties:
        tripId: { type: string, example: '1' }
        customerId: { type: string, example: '1' }
        driverId: { type: string, example: '1' }
        reason: { type: string, example: x }
        canceledAt: { type: string, format: date-time }
    TripCompletedPayload:
      type: object
      required: [tripId, bookingId, customerId, driverId, completedAt]
      properties:
        tripId: { type: string, example: '1' }
        bookingId: { type: string, example: '6' }
        customerId: { type: string, example: '1' }
        driverId: { type: string, example: '1' }
        completedAt: { type: string, format: date-time }
    PaymentCompletedPayload:
      type: object
      required: [paymentId, bookingId, tripId, customerId, amount, paidAt]
      properties:
        paymentId: { type: string, example: '1' }
        bookingId: { type: string, example: '6' }
        tripId: { type: string, example: '1' }
        customerId: { type: string, example: '1' }
        amount: { type: number, example: 50000 }
        paidAt: { type: string, format: date-time }
