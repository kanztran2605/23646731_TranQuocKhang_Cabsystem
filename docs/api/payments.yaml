openapi: 3.0.3
info:
  title: CAB System API - Payment
  version: 4.0.0
  description: 'Payment được tạo tự động khi payment-service consume booking.created: PENDING, amt=50000, eligible=false,
    tid=null.

    trip.completed chỉ gắn tid + eligible=true. Customer pay Payment đã tồn tại; callback mock hoàn tất Payment.'
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway local/demo
tags:
- name: Payment
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Pid:
      name: pid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
    Bid:
      name: bid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 6
    IdemKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        example: P1
  schemas:
    Payment:
      type: object
      required:
      - pid
      - bid
      - cid
      - amt
      - eligible
      - s
      properties:
        pid:
          type: integer
          format: int64
          example: 1
        bid:
          type: integer
          format: int64
          example: 6
        tid:
          type: integer
          format: int64
          nullable: true
          example: 1
        cid:
          type: integer
          format: int64
          example: 1
        amt:
          type: number
          format: double
          example: 50000
        eligible:
          type: boolean
          example: false
        s:
          type: string
          enum:
          - PENDING
          - COMPLETED
          example: PENDING
        key:
          type: string
          nullable: true
          example: P1
    CallbackRequest:
      type: object
      required:
      - s
      properties:
        s:
          type: string
          enum:
          - COMPLETED
          example: COMPLETED
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /payments/by-booking/{bid}:
    get:
      tags:
      - Payment
      summary: Lấy Payment đã tự tạo theo Booking
      operationId: getPaymentByBooking
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/Bid'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment chưa được consume/tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /payments/{pid}:
    get:
      tags:
      - Payment
      summary: Xem Payment
      operationId: getPayment
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Pid'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Không tìm thấy Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /payments/{pid}/pay:
    post:
      tags:
      - Payment
      summary: Thanh toán Payment đã tồn tại (idempotent)
      operationId: payExistingPayment
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      x-owner-only: true
      parameters:
      - $ref: '#/components/parameters/Pid'
      - $ref: '#/components/parameters/IdemKey'
      responses:
        '200':
          description: Payment hiện tại; replay cùng key trả cùng pid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không sở hữu Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Payment chưa eligible hoặc key conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-internal-flow:
      - Load existing Payment by pid
      - Require PENDING + eligible=true
      - Record/check Idempotency-Key; replay returns same pid
  /payments/{pid}/callback:
    post:
      tags:
      - Payment
      summary: Mock callback nội bộ cho demo
      operationId: paymentCallback
      security:
      - bearerAuth: []
      x-demo-only: true
      x-roles:
      - CUSTOMER
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/Pid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
      responses:
        '200':
          description: Payment COMPLETED; payment.completed được publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Callback không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: eligible=false hoặc state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-internal-flow:
      - Require PENDING + eligible=true
      - Set COMPLETED
      - Publish payment.completed -> trip-service + notification-service
