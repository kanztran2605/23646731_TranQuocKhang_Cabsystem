openapi: 3.0.3
info:
  title: CAB System API - Payment
  version: 4.0.0
  description: 'Payment được tạo tự động khi payment-service consume booking.created: PENDING, amt=50000, eligible=false,
    tid=null.

    trip.completed chỉ gắn tid + eligible=true. Customer pay Payment đã tồn tại; callback mock hoàn tất Payment.'
servers:
- url: http://localhost:8080/api
  description: API Gateway local/demo
tags:
- name: Payment
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Pid:
      name: pid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
    Bid:
      name: bid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 6
    IdemKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Bắt buộc có Idempotency-Key hoặc K tại Pay. Key được trim, dài 1–100 ký tự; ví dụ P55 hoặc 55. Nếu gửi cả hai phải giống nhau sau trim.'
      schema:
        type: string
        minLength: 1
        maxLength: 100
        example: P1
    IdemKeyAlias:
      name: K
      in: header
      required: false
      description: 'Alias của Idempotency-Key, chỉ áp dụng endpoint Pay. Replay dùng đúng key đầu tiên; cùng key cho Payment khác vẫn bị từ chối.'
      schema:
        type: string
        minLength: 1
        maxLength: 100
        example: P55
  schemas:
    Payment:
      type: object
      required:
      - 'Payment ID'
      - 'Booking ID'
      - 'Customer ID'
      - 'Amount'
      - 'Eligible'
      - 'Status'
      properties:
        'Payment ID':
          type: integer
          format: int64
          example: 1
        'Booking ID':
          type: integer
          format: int64
          example: 6
        'Trip ID':
          type: integer
          format: int64
          nullable: true
          example: 1
        'Customer ID':
          type: integer
          format: int64
          example: 1
        'Amount':
          type: number
          format: double
          example: 50000
        'Eligible':
          type: boolean
          example: false
        'Status':
          type: string
          enum:
          - PENDING
          - COMPLETED
          example: PENDING
        'Idempotency Key':
          type: string
          nullable: true
          example: P1
    CallbackRequest:
      type: object
      required:
      - s
      properties:
        s:
          type: string
          description: 'C là alias đầu vào REST của COMPLETED; gRPC, database, response và event giữ COMPLETED. Callback vẫn yêu cầu đã Pay hợp lệ.'
          enum:
          - C
          - COMPLETED
          example: COMPLETED
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /payments/by-booking/{bid}:
    get:
      tags:
      - Payment
      summary: Lấy Payment đã tự tạo theo Booking
      operationId: getPaymentByBooking
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/Bid'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment chưa được consume/tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /payments/{pid}:
    get:
      tags:
      - Payment
      summary: Xem Payment
      operationId: getPayment
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Pid'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Không tìm thấy Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /payments/{pid}/pay:
    post:
      tags:
      - Payment
      summary: Thanh toán Payment đã tồn tại (idempotent)
      operationId: payExistingPayment
      description: 'Gửi Idempotency-Key hoặc header ngắn K. Thiếu cả hai, key rỗng/quá dài hoặc hai header mâu thuẫn trả 400. Không đổi body hay cơ chế idempotency.'
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      x-owner-only: true
      parameters:
      - $ref: '#/components/parameters/Pid'
      - $ref: '#/components/parameters/IdemKey'
      - $ref: '#/components/parameters/IdemKeyAlias'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                amt:
                  type: number
                  example: 50000
                  description: Có thể bỏ; nếu nhập phải khớp amount của Payment.
      responses:
        '200':
          description: Response Pay đầu tiên (PENDING) được lưu và trả nguyên nội dung khi replay, kể cả sau callback; GET Payment trả trạng thái hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: 'Key thiếu/rỗng/quá dài, hai header mâu thuẫn hoặc request không hợp lệ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không sở hữu Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Payment chưa eligible hoặc key conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-internal-flow:
      - Load existing Payment by pid
      - Require PENDING + eligible=true
      - Lưu request/response đầu tiên theo key trong payment_db; cùng key khác nội dung trả 409
  /payments/{pid}/callback:
    post:
      tags:
      - Payment
      summary: Mock callback nội bộ cho demo
      operationId: paymentCallback
      security:
      - bearerAuth: []
      x-demo-only: true
      x-roles:
      - CUSTOMER
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/Pid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
      responses:
        '200':
          description: Payment COMPLETED; payment.completed được publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Callback không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Chưa Pay hợp lệ, eligible=false hoặc state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-internal-flow:
      - Require PENDING + eligible=true
      - Set COMPLETED
      - Publish payment.completed -> trip-service + notification-service
