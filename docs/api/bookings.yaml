openapi: 3.0.3
info:
  title: CAB System API - Booking Management
  version: 4.0.0
  description: 'Booking/Matching/Offer cho Demo MVP. Sau khi Booking persist: publish booking.created để Payment Service tạo
    Payment PENDING, sau đó matching và tạo một Offer.'
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway local/demo
tags:
- name: Booking
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Bid:
      name: bid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 6
    Oid:
      name: oid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
  schemas:
    Location:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          format: double
          example: 10.76
        lng:
          type: number
          format: double
          example: 106.68
    CreateBookingRequest:
      type: object
      required:
      - p
      - d
      - vt
      properties:
        p:
          $ref: '#/components/schemas/Location'
        d:
          $ref: '#/components/schemas/Location'
        vt:
          type: string
          example: CAR
    Booking:
      type: object
      required:
      - bid
      - cid
      - p
      - d
      - vt
      - s
      properties:
        bid:
          type: integer
          format: int64
          example: 6
        cid:
          type: integer
          format: int64
          example: 1
        p:
          $ref: '#/components/schemas/Location'
        d:
          $ref: '#/components/schemas/Location'
        vt:
          type: string
          example: CAR
        s:
          type: string
          enum:
          - SEARCHING
          - ASSIGNED
          - NO_DRIVER_FOUND
          example: SEARCHING
        oid:
          type: integer
          format: int64
          nullable: true
          example: 1
        did:
          type: integer
          format: int64
          nullable: true
          example: 1
    Offer:
      type: object
      required:
      - oid
      - bid
      - did
      - s
      properties:
        oid:
          type: integer
          format: int64
          example: 1
        bid:
          type: integer
          format: int64
          example: 6
        did:
          type: integer
          format: int64
          example: 1
        vid:
          type: integer
          format: int64
          example: 1
        s:
          type: string
          enum:
          - OPEN
          - ACCEPTED
          example: OPEN
    BookingPage:
      type: object
      required:
      - page
      - limit
      - items
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 2
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
    AcceptResponse:
      type: object
      required:
      - oid
      - bid
      - s
      properties:
        oid:
          type: integer
          example: 1
        bid:
          type: integer
          example: 6
        s:
          type: string
          example: ACCEPTED
        tripPending:
          type: boolean
          example: true
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /bookings:
    post:
      tags:
      - Booking
      summary: Customer tạo Booking
      operationId: createBooking
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking được persist; booking.created được publish; matching tạo Offer nếu có Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Request không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Chỉ CUSTOMER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-internal-flow:
      - 'booking-service -> customer-service gRPC: validate Customer'
      - Persist Booking
      - Publish booking.created -> payment-service
      - 'booking-service -> driver-service gRPC: find nearest eligible Driver'
      - Create one Offer
      - Publish offer.created -> notification-service
  /bookings/{bid}:
    get:
      tags:
      - Booking
      summary: Xem Booking
      operationId: getBooking
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Bid'
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/me/bookings:
    get:
      tags:
      - Booking
      summary: Booking của Customer hiện tại + paging
      operationId: listMyBookings
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          example: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 2
          example: 2
      responses:
        '200':
          description: Danh sách Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Chỉ CUSTOMER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drivers/me/offers:
    get:
      tags:
      - Booking
      summary: Driver xem Offer của mình
      operationId: listMyOffers
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
      responses:
        '200':
          description: Danh sách Offer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Chỉ DRIVER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /offers/{oid}/accept:
    post:
      tags:
      - Booking
      summary: Driver Accept Offer
      operationId: acceptOffer
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
      parameters:
      - $ref: '#/components/parameters/Oid'
      responses:
        '200':
          description: Offer ACCEPTED; driver.accepted được publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResponse'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không phải Driver nhận Offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Offer không OPEN hoặc Driver không AVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-internal-flow:
      - Validate Offer OPEN and owned by Driver
      - 'booking-service -> driver-service gRPC: AVAILABLE -> BUSY'
      - Persist Offer ACCEPTED + DriverAssignment
      - Publish driver.accepted -> trip-service
