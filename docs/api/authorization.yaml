openapi: 3.0.3
info:
  title: CAB System API - Authorization
  version: 3.0.0
  description: Role/Permission thuộc Identity & Access; System Administrator/Operation Staff có quyền phù hợp mới được quản
    lý phân quyền.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway - môi trường local/demo
tags:
- name: Phân quyền
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Forbidden:
      description: Người dùng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu Access Token hoặc Access Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Vượt quá giới hạn request; Gateway trả HTTP 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Role:
      type: object
      properties:
        roleId:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
    PermissionsRequest:
      type: object
      required:
      - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
paths:
  /roles:
    get:
      tags:
      - Phân quyền
      summary: Xem danh sách vai trò
      operationId: listRoles
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Role list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /roles/{roleId}/permissions:
    put:
      tags:
      - Phân quyền
      summary: Cập nhật quyền của vai trò
      operationId: updateRolePermissions
      security:
      - bearerAuth: []
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionsRequest'
      responses:
        '200':
          description: Permissions updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
