openapi: 3.0.3
info:
  title: CAB System API - Authorization Policy
  version: 4.0.0
  description: Tài liệu policy RBAC của API Gateway cho Demo MVP. Đây không phải Authorization Service riêng và không tạo
    API quản trị Role/Permission.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway local/demo
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths: {}
x-rbac-rules:
- route: GET /drivers/{did}
  allow:
  - ADMIN
  demo: '#12 ADMIN -> 200; #28 CUSTOMER -> 403'
- route: GET /drivers/nearby
  allow:
  - ADMIN
- route: PATCH /drivers/{did}/approval
  allow:
  - ADMIN
- route: PATCH /drivers/me/availability
  allow:
  - DRIVER
- route: PUT /drivers/me/location
  allow:
  - DRIVER
- route: POST /bookings
  allow:
  - CUSTOMER
- route: GET /customers/me/bookings
  allow:
  - CUSTOMER
- route: POST /offers/{oid}/accept
  allow:
  - DRIVER
- route: PATCH /trips/{tid}/status
  allow:
  - DRIVER
  rule: Driver phải là Driver được gán
- route: PATCH /trips/{tid}/location
  allow:
  - DRIVER
  rule: Driver phải là Driver được gán
- route: POST /trips/{tid}/cancel
  allow:
  - CUSTOMER
  rule: Customer phải sở hữu Trip
- route: POST /payments/{pid}/pay
  allow:
  - CUSTOMER
  rule: Customer phải sở hữu Payment
- route: POST /trips/{tid}/reviews
  allow:
  - CUSTOMER
  rule: Customer phải sở hữu Trip
