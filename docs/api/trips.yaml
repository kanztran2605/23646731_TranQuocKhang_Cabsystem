openapi: 3.0.3
info:
  title: CAB System API - Trip Management
  version: 4.0.0
  description: 'Trip được tạo async từ driver.accepted. State machine: ASSIGNED -> ARRIVED -> IN_PROGRESS -> COMPLETED; có
    location update và cancel.'
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway local/demo
tags:
- name: Trip
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Tid:
      name: tid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
    Bid:
      name: bid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 6
  schemas:
    Trip:
      type: object
      required:
      - tid
      - bid
      - cid
      - did
      - s
      - paid
      properties:
        tid:
          type: integer
          format: int64
          example: 1
        bid:
          type: integer
          format: int64
          example: 6
        cid:
          type: integer
          format: int64
          example: 1
        did:
          type: integer
          format: int64
          example: 1
        s:
          type: string
          enum:
          - ASSIGNED
          - ARRIVED
          - IN_PROGRESS
          - COMPLETED
          - CANCELED
          example: ASSIGNED
        paid:
          type: boolean
          example: false
        r:
          type: string
          nullable: true
          example: x
    StatusRequest:
      type: object
      required:
      - s
      properties:
        s:
          type: string
          enum:
          - ARRIVED
          - IN_PROGRESS
          - COMPLETED
          example: ARRIVED
    LocationRequest:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          format: double
          example: 10.761
        lng:
          type: number
          format: double
          example: 106.681
    CancelRequest:
      type: object
      required:
      - r
      properties:
        r:
          type: string
          minLength: 1
          maxLength: 100
          example: x
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /trips/by-booking/{bid}:
    get:
      tags:
      - Trip
      summary: Lấy Trip theo Booking sau driver.accepted
      operationId: getTripByBooking
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Bid'
      responses:
        '200':
          description: Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Trip chưa được tạo / không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/{tid}:
    get:
      tags:
      - Trip
      summary: Xem Trip
      operationId: getTrip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Tid'
      responses:
        '200':
          description: Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Không tìm thấy Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/{tid}/status:
    patch:
      tags:
      - Trip
      summary: Driver cập nhật trạng thái Trip
      operationId: updateTripStatus
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
      x-assigned-driver-only: true
      parameters:
      - $ref: '#/components/parameters/Tid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Trip sau cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: State transition sai thứ tự
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không phải Driver được gán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Trip terminal state / conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-internal-flow:
      - Persist valid state transition + status history
      - Publish trip.status.changed
      - 'If COMPLETED: publish trip.completed'
  /trips/{tid}/location:
    patch:
      tags:
      - Trip
      summary: Cập nhật vị trí Trip khi IN_PROGRESS
      operationId: updateTripLocation
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
      x-assigned-driver-only: true
      parameters:
      - $ref: '#/components/parameters/Tid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Location đã ghi nhận
          content:
            application/json:
              schema:
                type: object
                properties:
                  tid:
                    type: integer
                    example: 1
                  lat:
                    type: number
                    example: 10.761
                  lng:
                    type: number
                    example: 106.681
        '400':
          description: lat/lng không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không phải Driver được gán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Trip chưa IN_PROGRESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-internal-flow:
      - Require Trip IN_PROGRESS
      - Persist TripLocation
      - Trip -> Driver gRPC only when Driver/location validation is needed
  /trips/{tid}/cancel:
    post:
      tags:
      - Trip
      summary: Customer hủy Trip
      operationId: cancelTrip
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      x-owner-only: true
      parameters:
      - $ref: '#/components/parameters/Tid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Trip CANCELED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Thiếu reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Customer không sở hữu Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Trip không thể hủy ở state hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-internal-flow:
      - Persist CANCELED + reason
      - Publish trip.canceled -> driver-service + notification-service
