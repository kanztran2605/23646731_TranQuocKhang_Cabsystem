openapi: 3.0.3
info:
  title: CAB System API - Trip Management
  version: 3.0.0
  description: 'Public REST contract qua API Gateway cho Trip Aggregate. trip-service là service duy nhất sở hữu và thay đổi
    Trip; Trip được tạo bất đồng bộ khi consume driver.accepted. State Machine: ASSIGNED -> ARRIVED -> PICKED_UP -> IN_PROGRESS
    -> COMPLETED; CANCELED là terminal state.'
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway - môi trường local/demo
tags:
- name: Trips
  description: Trip lifecycle, tracking, cancellation và vận hành Trip
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu Access Token hoặc Access Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Người dùng đã xác thực nhưng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Vượt quá giới hạn request; Gateway trả HTTP 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Trip:
      type: object
      required:
      - tripId
      - bookingId
      - customerId
      - driverId
      - vehicleId
      - vehicleTypeId
      - status
      properties:
        tripId:
          type: string
          example: TRIP001
        bookingId:
          type: string
          example: BKG001
        customerId:
          type: string
          example: CUS001
        driverId:
          type: string
          example: DRV001
        status:
          type: string
          enum:
          - ASSIGNED
          - ARRIVED
          - PICKED_UP
          - IN_PROGRESS
          - COMPLETED
          - CANCELED
        distanceKm:
          type: number
          format: double
        cancelReason:
          type: string
          nullable: true
        canceledAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        vehicleId:
          type: string
          example: VEH001
        vehicleTypeId:
          type: string
          example: CAR_4_SEATS
        tripDistance:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Khoảng cách dùng cho Fare Calculation; phải có khi Trip COMPLETED.
        estimatedArrivalAt:
          type: string
          format: date-time
          nullable: true
        assignedAt:
          type: string
          format: date-time
          nullable: true
        arrivedAt:
          type: string
          format: date-time
          nullable: true
        pickedUpAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        abnormalFlag:
          type: boolean
          description: Dấu hiệu phục vụ UC17; không phải Trip Status.
          default: false
        abnormalReason:
          type: string
          nullable: true
    TripStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ARRIVED
          - PICKED_UP
          - IN_PROGRESS
          - COMPLETED
    CancelTripRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          example: Customer changed plan
    Error:
      type: object
      required:
      - code
      - message
      - timestamp
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
    TripStatusHistoryItem:
      type: object
      required:
      - historyId
      - tripId
      - toStatus
      - changedAt
      properties:
        historyId:
          type: string
        tripId:
          type: string
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
        changedByUserId:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        changedAt:
          type: string
          format: date-time
    ResolveAbnormalTripRequest:
      type: object
      required:
      - resolution
      - note
      properties:
        resolution:
          type: string
          example: RESOLVED
        note:
          type: string
          maxLength: 1000
paths:
  /trips/{tripId}:
    get:
      tags:
      - Trips
      summary: Xem thông tin Trip
      operationId: getTrip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Thông tin Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/status:
    patch:
      tags:
      - Trips
      summary: Driver cập nhật trạng thái Trip theo State Machine
      operationId: updateTripStatus
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR04.01-FR04.04
      - FR04.12
      - UC09
      - AC09.01-AC09.08
      description: 'Trình tự hợp lệ: ASSIGNED -> ARRIVED -> PICKED_UP -> IN_PROGRESS -> COMPLETED. Chuyển trạng thái không
        hợp lệ trả 409.'
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
      responses:
        '200':
          description: Trạng thái Trip đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{tripId}/cancel:
    post:
      tags:
      - Trips
      summary: Customer hủy Trip
      operationId: cancelTrip
      security:
      - bearerAuth: []
      x-srs-trace:
      - FR04.08-FR04.11
      - UC25
      - AC25.01-AC25.07
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTripRequest'
      responses:
        '200':
          description: Trip chuyển sang CANCELED và phát trip.canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{tripId}/history:
    get:
      tags:
      - Trips
      summary: Xem Trip Status History
      operationId: getTripStatusHistory
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Lịch sử trạng thái Trip
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripStatusHistoryItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/by-booking/{bookingId}:
    get:
      tags:
      - Trips
      summary: Tra cứu Trip theo Booking
      operationId: getTripByBooking
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Trip của Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/active:
    get:
      tags:
      - Trips
      summary: Operation Staff giám sát các Trip đang hoạt động
      operationId: getActiveTrips
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách Trip active
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-srs-trace:
      - UC16
  /trips/abnormal:
    get:
      tags:
      - Trips
      summary: Operation Staff tra cứu Trip bất thường
      operationId: getAbnormalTrips
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách Trip có abnormalFlag = true hoặc điều kiện vận hành tương đương
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-srs-trace:
      - UC17
  /trips/{tripId}/abnormal-resolution:
    post:
      tags:
      - Trips
      summary: Operation Staff xử lý Trip bất thường
      operationId: resolveAbnormalTrip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAbnormalTripRequest'
      responses:
        '200':
          description: Thông tin Trip sau xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-srs-trace:
      - UC17
