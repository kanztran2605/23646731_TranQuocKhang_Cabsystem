openapi: 3.0.3
info:
  title: CAB System API - Authentication
  version: 4.0.0
  description: 'Public REST contract qua API Gateway cho Identity & Access trong Demo MVP. Chỉ giữ Register Customer, Login
    và JWT.

    Không Refresh Token/Logout flow phức tạp. Driver OTP/onboarding thuộc Driver API.'
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway local/demo
tags:
- name: Authentication
components:
  schemas:
    RegisterRequest:
      type: object
      required:
      - email
      - pw
      - name
      properties:
        email:
          type: string
          format: email
          example: x@x.co
        pw:
          type: string
          minLength: 3
          example: '123'
        name:
          type: string
          maxLength: 100
          example: X
    RegisterResponse:
      type: object
      required:
      - uid
      - cid
      properties:
        uid:
          type: integer
          format: int64
          example: 4
        cid:
          type: integer
          format: int64
          example: 4
    LoginRequest:
      type: object
      required:
      - email
      - pw
      properties:
        email:
          type: string
          format: email
          example: c@c.com
        pw:
          type: string
          example: '123'
    LoginResponse:
      type: object
      required:
      - token
      - uid
      - role
      properties:
        token:
          type: string
          example: eyJhbGciOi...
        uid:
          type: integer
          format: int64
          example: 1
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - ADMIN
          example: CUSTOMER
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /register:
    post:
      tags:
      - Authentication
      summary: Đăng ký Customer
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tạo Account + Customer Profile thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Thiếu/sai dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-gateway-orchestration:
      - 'Gateway -> auth-service gRPC: create CUSTOMER account'
      - 'Gateway -> customer-service gRPC: create Customer Profile'
  /login:
    post:
      tags:
      - Authentication
      summary: Đăng nhập và nhận JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Request không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sai credential / SQLi không bypass
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Vượt rate limit tại Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
