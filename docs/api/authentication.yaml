openapi: 3.0.3
info:
  title: CAB System API - Authentication
  version: 4.0.0
  description: 'Public REST contract qua API Gateway cho Identity & Access trong Demo MVP. Chỉ giữ Register Customer, Login
    và JWT.

    Không Refresh Token/Logout flow phức tạp. Driver OTP/onboarding thuộc Driver API.'
servers:
- url: http://localhost:8080/api
  description: API Gateway local/demo
tags:
- name: Authentication
components:
  schemas:
    RegisterRequest:
      type: object
      required:
      - email
      - pw
      - name
      properties:
        email:
          type: string
          format: email
          example: x@x.co
        pw:
          type: string
          minLength: 3
          example: '123'
        name:
          type: string
          maxLength: 100
          example: X
        phone:
          type: string
          example: '0901234567'
          description: Không bắt buộc; chuẩn hóa số Việt Nam, không yêu cầu OTP Customer.
    RegisterResponse:
      type: object
      required:
      - 'User ID'
      - 'Customer ID'
      properties:
        'User ID':
          type: integer
          format: int64
          example: 4
        'Customer ID':
          type: integer
          format: int64
          example: 4
    LoginRequest:
      type: object
      required:
      - email
      - pw
      properties:
        email:
          type: string
          format: email
          example: c@c.com
        pw:
          type: string
          example: '123'
    LoginResponse:
      type: object
      required:
      - 'Token'
      - 'User ID'
      - 'Role'
      properties:
        'Token':
          type: string
          example: eyJhbGciOi...
        'User ID':
          type: integer
          format: int64
          example: 1
        'Role':
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - ADMIN
          example: CUSTOMER
        'Customer ID':
          type: integer
          format: int64
          nullable: true
          description: Chỉ trả cho CUSTOMER; null nếu Account chưa có CustomerProfile.
          example: 3
        'Driver ID':
          type: integer
          format: int64
          nullable: true
          description: Chỉ trả cho DRIVER; null nếu Account chưa có Driver profile. ADMIN không có ID hồ sơ riêng.
          example: 8
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request không hợp lệ
        at:
          type: string
          format: date-time
paths:
  /register:
    post:
      tags:
      - Authentication
      summary: Đăng ký Customer
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tạo Account + Customer Profile thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Thiếu/sai dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-gateway-orchestration:
      - 'Gateway -> auth-service gRPC: create CUSTOMER account'
      - 'Gateway -> customer-service gRPC: create Customer Profile'
  /login:
    post:
      tags:
      - Authentication
      summary: Đăng nhập và nhận JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Request không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sai credential / SQLi không bypass
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Vượt rate limit tại Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
