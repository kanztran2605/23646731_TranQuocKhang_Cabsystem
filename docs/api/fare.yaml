openapi: 3.0.3
info:
  title: CAB System API - Fare
  version: 3.0.0
  description: Fare thuộc payment-service. Fare cuối cùng được tự động tính khi payment-service consume trip.status.changed
    với toStatus = COMPLETED; client không gọi API để kích hoạt Fare Calculation.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway - môi trường local/demo
tags:
- name: Cước phí
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request data is invalid
        timestamp:
          type: string
          format: date-time
    Fare:
      type: object
      required:
      - fareId
      - tripId
      - vehicleTypeId
      - tripDistance
      - amount
      - currency
      - pricingPolicySnapshot
      - calculatedAt
      properties:
        fareId:
          type: string
        tripId:
          type: string
        vehicleTypeId:
          type: string
        tripDistance:
          type: number
          format: double
          minimum: 0
        amount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          example: VND
        pricingData:
          type: object
          additionalProperties: true
          description: Input/snapshot phục vụ truy vết tính Fare.
        pricingPolicySnapshot:
          $ref: '#/components/schemas/PricingPolicySnapshot'
        calculatedAt:
          type: string
          format: date-time
      description: 'MVP formula: max(MinimumFare, BaseFare + TripDistance × PerKmRate).'
    PricingPolicySnapshot:
      type: object
      required:
      - baseFare
      - perKmRate
      - minimumFare
      - currency
      - version
      properties:
        baseFare:
          type: number
          format: double
        perKmRate:
          type: number
          format: double
        minimumFare:
          type: number
          format: double
        currency:
          type: string
          example: VND
        version:
          type: string
          example: '1'
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu Access Token hoặc Access Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Người dùng đã xác thực nhưng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Vượt quá giới hạn request; Gateway trả HTTP 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /trips/{tripId}/fare:
    get:
      tags:
      - Cước phí
      summary: Xem Fare cuối cùng của Trip đã COMPLETED
      operationId: getTripFare
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Fare đã được payment-service tính và lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Trip chưa COMPLETED hoặc Fare chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ddd-trace:
      - UC11
      - Fare Aggregate
